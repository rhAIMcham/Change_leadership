<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat simulation</title>
<style>
/* ==========================================================================
   CONTENTS
   1. Reset & variables
   2. Messages window (outer frame)
   3. Sidebar (conversation list)
   4. Conversation header
   5. Message area & bubbles
   6. Reply options
   7. Typing indicator & animations
   8. Reflection section
   9. Mobile
   ========================================================================== */


/* ==========================================================================
   1. RESET & VARIABLES
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  /* iMessage colours */
  --im-blue: #0B84FE;        /* sent bubbles, selected row */
  --im-grey: #E9E9EB;        /* received bubbles */
  --im-text: #000;
  --im-secondary: #8A8A8E;   /* timestamps, previews */
  --im-sidebar: #F2F2F7;     /* sidebar background */
  --im-line: #D1D1D6;        /* borders and dividers */

  /* Reflection section colours */
  --AIMblue: #4353A3;
  --darkBlue: #38416D;
  --white: #ffffff;
  --bg-input: #f5f3f0;
  --bg-selected-row: #e6f1fb;
  --text-primary: #1a1a1a;
  --border-subtle: #dedad3;
  --border-medium: #ccc8c0;
  --radius-md: 8px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}


/* ==========================================================================
   2. MESSAGES WINDOW (OUTER FRAME)
   ========================================================================== */

.workArea3 {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-size: 14px;
}

.messages-app {
  display: flex;
  width: 860px;
  max-width: 100%;
  height: 600px;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--im-line);
  border-radius: 12px;
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.18);
}


/* ==========================================================================
   3. SIDEBAR (CONVERSATION LIST)
   ========================================================================== */

.left-sidebar {
  display: flex;
  flex-direction: column;
  width: 240px;
  flex-shrink: 0;
  background: var(--im-sidebar);
  border-right: 1px solid var(--im-line);
}

/* Red / yellow / green window buttons */
.window-dots {
  display: flex;
  gap: 8px;
  padding: 14px 16px 6px;
}

.window-dots span {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.window-dots span:nth-child(1) { background: #FF5F57; }
.window-dots span:nth-child(2) { background: #FEBC2E; }
.window-dots span:nth-child(3) { background: #28C840; }

.sidebar-header {
  padding: 8px 16px 10px;
}

.sidebar-header-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

/* One conversation row */
.dm-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 8px;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
}

.dm-item:hover {
  background: rgba(0, 0, 0, 0.05);
}

/* Selected row */
.dm-item.active {
  background: var(--im-blue);
  color: #fff;
}

.dm-item.active .dm-preview {
  color: rgba(255, 255, 255, 0.85);
}

.dm-text {
  flex: 1;
  min-width: 0;
}

.dm-name {
  font-size: 14px;
  font-weight: 600;
}

.dm-preview {
  overflow: hidden;
  font-size: 12px;
  color: var(--im-secondary);
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* Blue unread dot */
.dm-unread {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  background: var(--im-blue);
  border-radius: 50%;
}

.dm-item.active .dm-unread {
  background: #fff;
}

/* Round contact avatar (used in sidebar and header) */
.avatar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  background: linear-gradient(#A6ABBA, #7D8191);
  border-radius: 50%;
}

.avatar.small {
  width: 28px;
  height: 28px;
  font-size: 11px;
}


/* ==========================================================================
   4. CONVERSATION HEADER
   ========================================================================== */

.chat-pane {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  background: #fff;
}

.chat-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 10px 16px 8px;
  background: rgba(246, 246, 246, 0.95);
  border-bottom: 1px solid var(--im-line);
}

.chat-header-name {
  font-size: 12px;
  color: var(--im-text);
}

/* The "To:" label */
.chat-header-name b {
  margin-right: 4px;
  font-weight: 400;
  color: var(--im-secondary);
}

.chat-header-desc {
  font-size: 11px;
  text-align: center;
  color: var(--im-secondary);
}


/* ==========================================================================
   5. MESSAGE AREA & BUBBLES
   ========================================================================== */

.chat-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  overflow-y: auto;
  padding: 14px 18px 18px;
  overflow-x: hidden;
}

/* "Today 3:03 PM" */
.date-divider {
  margin: 6px 0 10px;
  font-size: 11px;
  text-align: center;
  color: var(--im-secondary);
}

.date-divider b {
  font-weight: 600;
}

/* A run of bubbles from one sender */
.msg-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 8px;
}

.msg-group.them { align-items: flex-start; }  /* received: left */
.msg-group.me   { align-items: flex-end; }    /* sent: right */

/* Single bubble */
.bubble {
  position: relative;
  max-width: 72%;
  padding: 7px 13px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.them .bubble {
  background: var(--im-grey);
  color: var(--im-text);
}

.me .bubble {
  background: var(--im-blue);
  color: #fff;
}

/* Bubble tail: only on the last bubble in a group.
   ::before draws the coloured curve, ::after masks it with white. */
.bubble.last::before,
.bubble.last::after {
  content: '';
  position: absolute;
  bottom: 0;
  height: 18px;
}

/* Tail on received bubbles (left) */
.them .bubble.last::before {
  left: -7px;
  width: 20px;
  background: var(--im-grey);
  border-bottom-right-radius: 16px 14px;
}

.them .bubble.last::after {
  left: -26px;
  width: 26px;
  background: #fff;
  border-bottom-right-radius: 10px;
}

/* Tail on sent bubbles (right) */
.me .bubble.last::before {
  right: -7px;
  width: 20px;
  background: var(--im-blue);
  border-bottom-left-radius: 16px 14px;
}

.me .bubble.last::after {
  right: -26px;
  width: 26px;
  background: #fff;
  border-bottom-left-radius: 10px;
}

/* "Delivered" / "Read" */
.receipt {
  margin: 2px 4px 0;
  font-size: 11px;
  font-weight: 500;
  color: var(--im-secondary);
}


/* ==========================================================================
   6. REPLY OPTIONS
   ========================================================================== */

.explainerP {
  margin: 14px 0 8px;
  font-size: 12px;
  text-align: center;
  color: var(--im-secondary);
}

.chat-answers-box {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.learnerOption {
  max-width: 88%;
  padding: 9px 14px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--im-blue);
  background: #fff;
  border: 1.5px solid var(--im-blue);
  border-radius: 18px;
  cursor: pointer;
  transition: background 200ms ease, color 200ms ease;
}

.learnerOption:hover,
.learnerOption:focus-visible {
  color: #fff;
  background: var(--im-blue);
  outline: none;
}


/* ==========================================================================
   7. TYPING INDICATOR & ANIMATIONS
   ========================================================================== */

.typing-bubble {
  position: relative;
  display: inline-flex;
  gap: 4px;
  padding: 11px 14px;
  background: var(--im-grey);
  border-radius: 18px;
}

.typing-bubble span {
  width: 8px;
  height: 8px;
  background: #A5A5AA;
  border-radius: 50%;
  animation: typingBounce 1.1s infinite ease-in-out;
}

.typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typingBounce {
  0%, 70%, 100% {
    transform: translateY(0);
    opacity: 0.5;
  }
  35% {
    transform: translateY(-3px);
    opacity: 1;
  }
}

/* Fade-in for Michael's reply */
.new-message {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.new-message.visible {
  opacity: 1;
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  .typing-bubble span { animation: none; }
  .new-message { transition: none; }
}


/* ==========================================================================
   8. REFLECTION SECTION
   ========================================================================== */

.container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 1000px;
  max-width: 100%;
  margin: 0 auto;
  padding: 0 20px 40px;
  font-size: 14px;
  color: var(--text-primary);
}

.instructions {
  padding: 18px 22px;
  line-height: 1.6;
  background: var(--white);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--AIMblue);
}

.instructions h2 {
  margin-bottom: 6px;
  font-size: 16px;
  font-weight: 600;
}

.reflection {
  background: var(--white);
  border: 1px solid var(--border-medium);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
}

.reflection-bar {
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  background: #f5f3f0;
  border-bottom: 1px solid var(--border-subtle);
}

.question {
  padding: 20px;
  border-bottom: 1px solid var(--border-subtle);
}

.question-head {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
}

.question-num {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--darkBlue);
  background: var(--bg-selected-row);
  border-radius: 50%;
}

.question-text {
  max-width: 75ch;
  padding-top: 2px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
}

.question textarea {
  display: block;
  width: 100%;
  min-height: 140px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  resize: vertical;
}

.question textarea:focus {
  background: var(--white);
  border-color: var(--AIMblue);
  outline: none;
}

/* Footer with "Saved!" message (left) and Save button (right) */
.reflection-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  background: #f5f3f0;
}

.savedMsg {
  font-size: 13px;
  color: var(--AIMblue);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.saveBtn {
  padding: 8px 22px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--white);
  background-color: var(--AIMblue);
  border: none;
  border-radius: 99px;
  cursor: pointer;
}

.saveBtn:hover {
  background-color: var(--darkBlue);
}

.saveBtn:focus-visible {
  outline: 2px solid var(--AIMblue);
  outline-offset: 2px;
}


/* ==========================================================================
   9. MOBILE (768px and under)
   ========================================================================== */

@media only screen and (max-width: 767px) {

  /* Chat window stacks: list on top, conversation below */
  .messages-app {
    flex-direction: column;
    width: 100%;
    height: auto;
  }

  .left-sidebar {
    width: 100%;
    border-right: 0;
    border-bottom: 1px solid var(--im-line);
  }

  .window-dots {
    display: none;
  }

  .sidebar-header {
    padding-top: 12px;
  }

  .chat-body {
    max-height: 380px;
  }

  .bubble {
    max-width: 85%;
  }

  /* Reflection */
  .container {
    padding: 0 12px 24px;
  }

  .question {
    padding: 16px 14px;
  }
}
</style>
</head>
<body>

<div class="workArea3" id="work3">
<div class="messages-app">

  <div class="left-sidebar">
    <div class="window-dots"><span></span><span></span><span></span></div>
    <div class="sidebar-header"><span class="sidebar-header-title">Messages</span></div>
    <div id="dmList"></div>
  </div>

  <div class="chat-pane">
    <div class="chat-header">
      <div id="header-icon"></div>
      <div class="chat-header-name"><b>To:</b><span id="chat-title"></span></div>
      <div class="chat-header-desc" id="chat-desc"></div>
    </div>
    <div class="chat-body" id="chat-body"></div>
  </div>

</div>
</div>

<div class="container">
  <div class="instructions">
    <h2>Reflection</h2>
    <p>Using what you have read about Michael and the two approaches you explored, reflect on how to respond when someone resists change.</p>
  </div>

  <div class="reflection" id="questionBox">
    <div class="reflection-bar">Your reflection</div>

    <div class="question">
      <div class="question-head">
        <span class="question-num" aria-hidden="true">1</span>
        <label class="question-text" for="reflect1">After choosing your response to Michael's refusal, how might you decide whether negotiation or influence is more appropriate when someone resists change?</label>
      </div>
      <textarea id="reflect1" data-q="1"></textarea>
    </div>

    <div class="question">
      <div class="question-head">
        <span class="question-num" aria-hidden="true">2</span>
        <label class="question-text" for="reflect2">If negotiation or influence is unsuccessful, how would you navigate the relationship while maintaining a professional relationship and continuing to support the change?</label>
      </div>
      <textarea id="reflect2" data-q="2"></textarea>
    </div>

    <div class="reflection-footer">
      <p id="reflectStatus" class="savedMsg" role="status">Saved!</p>
      <button id="reflectSave" class="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script>
/* LEARNER (name comes from the LMS) */
function titleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }
let storedName = 'Leader';
try { storedName = localStorage.getItem('riseUserName') || storedName; } catch (e) {}
const firstName = titleCase(storedName.trim()).split(' ')[0];

/* DATA — [NAME] becomes the learner's first name */
const people = {
  michael: {
    id: 'michael', name: 'Michael', initials: 'M',
    desc: 'he/him · Join date: 4 years ago',
    unread: 1,
    messages: [
      { time: '3:03 PM', text: [
        `Hi [NAME],`,
        `I’ve thought about this a bit more, and I’ve decided to bow out from the new system rollout. I don’t see the value in changing something that already works, and I have other priorities that need my attention. I understand this is something you’re being forced to push, but I don’t agree with the decision and am not interested in being involved. I think it’s best if you find someone else to help.`,
        `Thanks`
      ] }
    ],
    options: [
      { learner: [
          `I understand that you have concerns about the value of the new system, and I appreciate you have other priorities competing for your time. However, your involvement is important because our teams will be closely working together, and your support will affect communication across departments.`,
          `Could we look at what your involvement might realistically involve and whether there’s a way to accommodate some of your existing commitments? Perhaps we could agree on a more focused contribution, like identifying potential issues before implementation? I’d like to see whether we can find an arrangement that addresses some of your concerns while still supporting the org.`
        ],
        reply: [
          `I appreciate you trying to find a compromise, but I don’t think reducing my involvement is going to change how I feel about the project. I don’t believe this is the right approach, and I don’t want to commit to something that I don’t support. I think my position is pretty clear.`
        ] },
      { learner: [
          `I appreciate that you are comfortable with our current process, particularly given your experience working with them. However, I think it’s worth considering how the new system could address some of the difficulties coordinating work across departments.`,
          `Your experience could be particularly valuable in identifying where the implementation may not work as intended. Instead of viewing your involvement as support, there may be an opportunity to help shape how this change is introduced and ensure practical considerations are taken into account.`,
          `I would encourage you to reconsider whether stepping away entirely would be the best action for your team.`
        ],
        reply: [
          `I understand what you’re saying, and I can see why the organisation thinks this system might be useful. But I still don’t agree that it will solve any ongoing problems. I’ve seen similar initiatives introduced before, and they clearly haven’t delivered on what was promised. I don’t want to lend credibility to something I don’t believe in.`
        ] }
    ]
  }
};

const REPLY_TIME = '3:22 PM';
const state = { michael: { chosen: null, replied: false } };
let currentId = 'michael';

/* HELPERS */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fill(t) { return t.replace(/\[NAME\]/g, firstName); }
function plain(arr) { return arr.map(fill).join(' '); }
function bubbles(arr) {
  return arr.map((t, i) => `<div class="bubble${i === arr.length - 1 ? ' last' : ''}">${esc(fill(t))}</div>`).join('');
}
function group(side, arr, extra, footer) {
  return `<div class="msg-group ${side}${extra ? ' ' + extra : ''}">${bubbles(arr)}${footer || ''}</div>`;
}

/* CHAT RENDERING */
function threadHtml(id) {
  const p = people[id], s = state[id];
  let html = `<div class="date-divider"><b>Today</b> ${esc(p.messages[0].time)}</div>`;
  html += p.messages.map(m => group('them', m.text)).join('');
  if (s.chosen === null) {
    html += `
      <div>
        <div class="explainerP">Select the option you would send in this scenario.</div>
        <div class="chat-answers-box">
          ${p.options.map((o, i) => `
            <div class="chat-options learnerOption" data-choice="${i}" tabindex="0" role="button">${o.learner.map(t => `<p>${esc(fill(t))}</p>`).join('<br>')}</div>`).join('')}
        </div>
      </div>`;
  } else {
    const o = p.options[s.chosen];
    html += `<div class="date-divider"><b>Today</b> ${REPLY_TIME}</div>`;
    html += group('me', o.learner, 'learner', `<div class="receipt">${s.replied ? 'Read' : 'Delivered'}</div>`);
    if (s.replied) html += group('them', o.reply);
  }
  return html;
}

function setChat(id) {
  currentId = id;
  const p = people[id];
  document.getElementById('chat-title').textContent = p.name;
  document.getElementById('chat-desc').textContent = p.desc;
  document.getElementById('header-icon').innerHTML = `<div class="avatar small">${esc(p.initials)}</div>`;
  const body = document.getElementById('chat-body');
  body.innerHTML = threadHtml(id);
  body.scrollTop = body.scrollHeight;
}

function preview(p) { return p.messages[p.messages.length - 1].text[1] || p.messages[0].text[0]; }

function renderDMs() {
  document.getElementById('dmList').innerHTML = Object.values(people).map(p => `
    <div class="dm-item${p.id === currentId ? ' active' : ''}" data-dm="${p.id}" tabindex="0" role="button">
      <div class="avatar">${esc(p.initials)}</div>
      <div class="dm-text">
        <div class="dm-name">${esc(p.name)}</div>
        <div class="dm-preview">${esc(fill(preview(p)))}</div>
      </div>
      ${p.unread ? '<span class="dm-unread" aria-label="Unread"></span>' : ''}
    </div>`).join('');
}

function loadDM(id) { people[id].unread = 0; renderDMs(); setChat(id); }

/* CHOOSING A REPLY */
function chooseOption(index) {
  const id = currentId, p = people[id], s = state[id];
  if (s.chosen !== null) return;
  s.chosen = index;

  const body = document.getElementById('chat-body');
  body.innerHTML = threadHtml(id) + `
    <div class="msg-group them" id="typing-${id}"><div class="typing-bubble"><span></span><span></span><span></span></div></div>`;
  body.scrollTop = body.scrollHeight;

  const o = p.options[index];
  try {   // saved for use elsewhere in the course
    localStorage.setItem(p.name + 'Choice', plain(o.learner));
    localStorage.setItem(p.name + 'Response', plain(o.reply));
  } catch (e) {}

  setTimeout(() => {
    s.replied = true;
    const indicator = document.getElementById('typing-' + id);
    if (indicator) indicator.remove();
    const receipt = body.querySelector('.receipt');
    if (receipt) receipt.textContent = 'Read';
    const el = document.createElement('div');
    el.innerHTML = group('them', o.reply, 'new-message');
    const node = el.firstElementChild;
    body.appendChild(node);
    requestAnimationFrame(() => node.classList.add('visible'));
    body.scrollTop = body.scrollHeight;
  }, 1400);
}

document.getElementById('chat-body').addEventListener('click', e => {
  const opt = e.target.closest('[data-choice]');
  if (opt) chooseOption(Number(opt.dataset.choice));
});
document.getElementById('chat-body').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const opt = e.target.closest('[data-choice]');
  if (opt) { e.preventDefault(); chooseOption(Number(opt.dataset.choice)); }
});
document.getElementById('dmList').addEventListener('click', e => {
  const item = e.target.closest('[data-dm]');
  if (item) loadDM(item.dataset.dm);
});

/* REFLECTION — answers are stored in localStorage as plain text */
function flashStatus(text) {
  const el = document.getElementById('reflectStatus');
  el.textContent = text;
  el.style.opacity = 1;
  clearTimeout(flashStatus.t);
  flashStatus.t = setTimeout(() => { el.style.opacity = 0; }, 3000);
}

function saveAnswer(box) {
  const key = 'negotiationCasestudy' + box.dataset.q;
  const text = box.value.trim();
  try {
    if (text) localStorage.setItem(key, text);
    else localStorage.removeItem(key);   // nothing typed, nothing stored
  } catch (err) {}
}

// Auto-save while typing
document.querySelectorAll('.question textarea').forEach(box => {
  box.addEventListener('input', () => saveAnswer(box));
});

// Save button: store all answers again and show "Saved!" on the left
document.getElementById('reflectSave').addEventListener('click', () => {
  document.querySelectorAll('.question textarea').forEach(saveAnswer);
  flashStatus('Saved!');
});

<script>
const textElement = document.getElementById('text')
const optionButtonsElement = document.getElementById('option-buttons')
const imageElement = document.getElementById('image-area')
const exportChoices = [];
const instruction = document.getElementById('instruction')
var exported = false;

  // Each lesson uses a unique key (example: eNotes1, eNotes2, eNotes3)
  const STORAGE_KEY = 'FrameOfMindStudiosExport';

let state = {}
let stepCount = 1

function startGame() {
    state = {}
    stepCount = 1
    showTextNode(1)
}

function showTextNode(textNodeIndex) {
    const textNode = textNodes.find(textNode => textNode.id === textNodeIndex)
    textElement.innerHTML = textNode.text
// reset the box
imageElement.textContent = ''
imageElement.style.backgroundImage = ''
imageElement.removeAttribute('role')
imageElement.removeAttribute('aria-label')

// per-scene overrides (empty string = fall back to the :root default)
imageElement.style.setProperty('--img-height', textNode.imageHeight || '')
imageElement.style.setProperty('--img-fit', textNode.imageFit || '')
imageElement.style.setProperty('--img-pos', textNode.imagePosition || '')

if (textNode.image) {
    imageElement.style.backgroundImage = `url("${textNode.image}")`
    imageElement.setAttribute('role', 'img')
    imageElement.setAttribute('aria-label', `Screen ${textNode.id} image`)
}  else {
        const label = document.createElement('div')
        label.classList.add('image-placeholder-label')
        label.innerText = `[ image placeholder: node ${textNode.id} ]`
        imageElement.appendChild(label)
    }

    while (optionButtonsElement.firstChild) {
        optionButtonsElement.removeChild(optionButtonsElement.firstChild)
    }

    const isEnding = textNode.options.length === 1 && textNode.options[0].nextText <= 0
    

    textNode.options.forEach(option => {
        if (showOption(option)) {
            const button = document.createElement('button')
            button.innerHTML = option.text
            button.classList.add('opt-btn')
            if (isEnding) button.classList.add('restart-btn')
            if (isEnding) instruction.style.display = 'none';
            else instruction.style.display = 'block';
            // if (isEnding) exported = true;
            button.addEventListener('click', () => selectOption(option))
            optionButtonsElement.appendChild(button)
        }
    })
    if (exported === false) {
        //  var cleaned = textElement.innerHTML.replace(/<\/?p[^>]*>/gi, "");
        exportChoices.push(textElement.innerHTML);
    } else {
        return null;
    }

    // renderProgress()
    console.log(exportChoices);
    console.log(exported);
}

function showOption(option) {
    return option.requiredState == null || option.requiredState(state)
}

function selectOption(option) {
    const nextTextNodeId = typeof option.nextText === "function"
        ? option.nextText()
        : option.nextText;

    if (nextTextNodeId <= 0) {
        exportChoices.push(textElement.innerHTML);
        exported = true;
        exportChoices.pop(); 

        const rawHtml = exportChoices.join('\n');
        const cleaned = exportReady(rawHtml);

        localStorage.setItem(STORAGE_KEY, cleaned);
        return startGame();
    }

    state = Object.assign(state, option.setState);
    stepCount += 1;
    showTextNode(nextTextNodeId);
}

function exportReady(htmlString) {
    return htmlString
        .replace(/<\/p>/gi, '\n\n')
        .replace(/<p[^>]*>/gi, '')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<strong[^>]*>/gi, '**')
        .replace(/<\/strong>/gi, '**')
        .replaceAll("You decide to:", "");
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<title>Change Readiness Assessment</title>
<style>
/* =========================================================
   CONTENTS
   1. Design tokens (colours, sizes) – edit these first
   2. Base & page layout
   3. Header & intro
   4. Tab navigation
   5. Slides & section titles
   6. Questions & rating scale
   7. Buttons
   8. Results page
   9. Utilities
   ========================================================= */


/* ---------- 1. Design tokens ---------- */
:root {
  /* Brand colours */
  --AIMblue:   #4353A3;
  --darkBlue:  #38416D;
  --navy:      #12195C;
  --lightBlue: #AEBAE4;
  --teal:      #5DC8B9;
  --rust:      #AF4510;
  --cream:     #F1EEDE;
  --white:     #fff;

  /* Neutrals */
  --text-muted: #666;
  --text-faint: #888;
  --divider:    #ccc;

  /* Sizing */
  --content-width: 900px;   /* assessment width */
  --results-width: 600px;   /* results page width */
  --radius:        8px;
  --scale-size:    36px;    /* diameter of the 0–3 rating circles */

  /* Keeps content clear of phone status/home bars */
  box-sizing: border-box;
  padding-top:    env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}


/* ---------- 2. Base & page layout ---------- */
* {
  box-sizing: border-box;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0;
  padding: 20px 10px;
  font-family: "IBM Plex Sans", sans-serif;
  background: var(--white);
  color: var(--navy);
}

.wrap {
  width: 100%;
  max-width: var(--content-width);
}


/* ---------- 3. Header & intro ---------- */
h1 {
  text-align: center;
  font-size: 1.5rem;
  color: var(--navy);
}

.intro {
  text-align: center;
  margin-bottom: 10px;
  color: var(--darkBlue);
}


/* ---------- 4. Tab navigation ---------- */
.navigation {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 5px 0 20px;
}

.nav-button {
  min-width: 160px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: .9rem;
  font-weight: 500;
  background: var(--cream);
  color: var(--darkBlue);
  border: 2px solid var(--darkBlue);
  border-radius: var(--radius);
  cursor: pointer;
      max-width: 120px;
}

.nav-button.active {
  background: var(--AIMblue);
  color: var(--white);
  border-color: var(--AIMblue);
}


/* ---------- 5. Slides & section titles ---------- */
.CardSlide {
  display: none;
}

.CardSlide.active {
  display: block;
}

.slide-title {
  margin: 0 0 8px;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--rust);
}

.placeholder {            /* shown on forms with no questions yet */
  padding: 40px 0;
  text-align: center;
  color: var(--text-muted);
}


/* ---------- 6. Questions & rating scale ---------- */
.scale-key {              /* "0 = not at all → 3 = strongly agree" */
  margin-bottom: 6px;
  text-align: right;
  font-size: .75rem;
  color: var(--text-muted);
}

.question {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 2px dotted var(--divider);
}

.question p {
  flex: 1 1 260px;
  margin: 0;
  text-align: left;
}

/* Rating circles */
.scale {
  display: flex;
  gap: 6px;
}

.scale label {
  cursor: pointer;
}

.scale input {            /* real radio is hidden; the <span> is the visible circle */
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
}

.scale span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--scale-size);
  height: var(--scale-size);
  font-weight: 600;
  color: var(--darkBlue);
  border: 2px solid var(--darkBlue);
  border-radius: 50%;
}

.scale input:checked + span {
  background: var(--AIMblue);
  color: var(--white);
  border-color: var(--AIMblue);
}

.scale input:focus-visible + span {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}


/* ---------- 7. Buttons ---------- */
.submit-button {
  display: block;
  width: 220px;
  margin: 20px auto;
  padding: 10px;
  font-family: inherit;
  font-size: 1rem;
  background: var(--navy);
  color: var(--white);
  border: 2px solid var(--cream);
  border-radius: var(--radius);
  cursor: pointer;
}

.submit-button:hover {
  background: var(--lightBlue);
  color: var(--navy);
  border-color: var(--navy);
}


/* ---------- 8. Results page ---------- */
#results {
  max-width: var(--results-width);
  margin: 15px auto;
  font-size: .95rem;
  line-height: 1.5;
}

#results h2 {
  text-align: center;
  color: var(--navy);
}

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 2px dotted var(--divider);
}

.result-row small {       /* "9 of 9 answered" */
  display: block;
  font-weight: 400;
  color: var(--text-muted);
}

.result-row .score {
  font-weight: 600;
  white-space: nowrap;
  color: var(--AIMblue);
}

.result-row.pending,
.result-row.pending .score {   /* forms with no questions yet */
  color: var(--text-faint);
}


/* ---------- 9. Utilities ---------- */
.hidden {
  display: none;
}
</style>
</head>
<body>
<div class="wrap" id="displayed">
  <h1>Emotional intelligence self-assessment</h1>
  <br>
  <p class="intro">Reflecting on your own leadership journey and other leaders you have worked with in the past, how well do you:</p>
  <br>
  <nav aria-label="Assessment navigation">
    <div class="navigation" role="tablist" id="tabs"></div>
  </nav>
    <br>
</div>

<div class="wrap" id="CardHolder"></div>

<div class="wrap hidden" id="graphDisp">
  <div id="results" aria-live="polite"></div>
  <button class="submit-button" onclick="backToAssessment()">Back to Assessment</button>
</div>

<script>
// One entry per form. Add the remaining four question sets by filling in `questions`.
const FORMS = [
  {
    label: "Self-awareness",
    questions: [
      "Acknowledge your own limitations and strengths",
      "Model ideal behaviours in the workplace",
      "Understand how your behaviour impacts others",
      "Honestly communicate your thoughts and opinions",
      "Learn from your mistakes"
    ]
  },
  {
    label: "Self-management",
    questions: [
      "Constructively respond to feedback on your leadership",
      "Remain consistent with your words and actions",
      "Adjust your leadership style to benefit others",
      "Consult others when making decisions",
      "Reflect on your feelings when decision-making"
    ]
  },
  { label: "Social awareness", 
    questions: [
      "Make others feel appreciated",
      "Acknowledge the views and opinions of others",
      "Accurately anticipate the responses of others to change",
      "Maintain a positive work environment",
      "Express thoughts and feelings sensitively to others"
  ] 
},
  { label: "Relationship management",
      questions: [
      "Provide support and guidance during challenges",
      "Encourage honesty and open debate in the workplace",
      "Respond consistently to inappropriate behaviour in the workplace",
      "Help others understand their contributions to the organisation",
      "Facilitate the development of others in the workplace"
  ] 
}
];

const MAX_SCORE = 5;
const tabsEl = document.getElementById('tabs');
const holder = document.getElementById('CardHolder');
const totalSlides = FORMS.length + 1; // forms + submit slide

function buildSlides() {
  FORMS.forEach((f, fi) => {
    const n = fi + 1;
    tabsEl.insertAdjacentHTML('beforeend',
      `<button class="nav-button" role="tab" aria-selected="false" aria-controls="slide-${n}" id="tab-${n}" onclick="goToSlide(${n})">${f.label}</button>`);

    const slide = document.createElement('div');
    slide.className = 'CardSlide';
    slide.id = `slide-${n}`;
    slide.setAttribute('role', 'tabpanel');
    slide.setAttribute('aria-labelledby', `tab-${n}`);

    const title = document.createElement('h2');
    title.className = 'slide-title';
    title.textContent = f.label;
    slide.appendChild(title);

    if (!f.questions.length) {
      const ph = document.createElement('p');
      ph.className = 'placeholder';
      ph.textContent = 'Questions for this section are coming soon.';
      slide.appendChild(ph);
    } else {
      const key = document.createElement('div');
      key.className = 'scale-key';
      key.textContent = `0 = not at all  →  ${MAX_SCORE} = always`;
      slide.appendChild(key);

      const form = document.createElement('form');
      form.id = `form-${fi}`;
      f.questions.forEach((qText, qi) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        const p = document.createElement('p');
        p.textContent = qText;
        qDiv.appendChild(p);

        const scale = document.createElement('div');
        scale.className = 'scale';
        for (let v = 0; v <= MAX_SCORE; v++) {
          const label = document.createElement('label');
          const input = document.createElement('input');
          input.type = 'radio';
          input.name = `f${fi}_q${qi}`;
          input.value = v;
          input.setAttribute('aria-label', `${qText}: rate ${v}`);
          const span = document.createElement('span');
          span.textContent = v;
          label.append(input, span);
          scale.appendChild(label);
        }
        qDiv.appendChild(scale);
        form.appendChild(qDiv);
      });
      slide.appendChild(form);
    }
    holder.appendChild(slide);
  });

  // Submit slide
  const n = totalSlides;
  tabsEl.insertAdjacentHTML('beforeend',
    `<button class="nav-button" role="tab" aria-selected="false" aria-controls="slide-${n}" id="tab-${n}" onclick="goToSlide(${n})">Submit &amp; Results</button>`);
  holder.insertAdjacentHTML('beforeend', `
    <div class="CardSlide" id="slide-${n}" role="tabpanel" aria-labelledby="tab-${n}">
      <div style="text-align:center;padding:40px;">
        <h2>Complete Your Assessment</h2>
        <p>Click below to see your average score for each section.</p>
        <button class="submit-button" onclick="showResults()">Submit &amp; View Results</button>
      </div>
    </div>`);
}

let currentSlide = 1;
function goToSlide(n) {
  document.querySelectorAll('.CardSlide').forEach(s => s.classList.remove('active'));
  document.getElementById(`slide-${n}`).classList.add('active');
  currentSlide = n;
  updateButtons();
}
function updateButtons() {
  document.querySelectorAll('.nav-button').forEach((btn, i) => {
    btn.classList.toggle('active', i === currentSlide - 1);
    btn.setAttribute('aria-selected', i === currentSlide - 1 ? 'true' : 'false');
  });
}
document.addEventListener('keydown', e => {
  if (document.getElementById('displayed').classList.contains('hidden')) return;
  if (e.target.matches && e.target.matches('input')) return; // let arrows move between radio options
  if (e.key === 'ArrowLeft' && currentSlide > 1) goToSlide(currentSlide - 1);
  if (e.key === 'ArrowRight' && currentSlide < totalSlides) goToSlide(currentSlide + 1);
});

function formAverage(fi) {
  const qs = FORMS[fi].questions;
  let sum = 0, answered = 0;
  qs.forEach((_, qi) => {
    const checked = document.querySelector(`input[name="f${fi}_q${qi}"]:checked`);
    if (checked) { sum += Number(checked.value); answered++; }
  });
  return { total: qs.length, answered, avg: answered ? sum / answered : null };
}

function showResults() {
  document.getElementById('CardHolder').classList.add('hidden');
  document.getElementById('displayed').classList.add('hidden');
  document.getElementById('graphDisp').classList.remove('hidden');

  let html = '<h2>Your Results</h2>';
  FORMS.forEach((f, fi) => {
    const r = formAverage(fi);
    if (!r.total) {
      html += `<div class="result-row pending"><span>${f.label}</span><span class="score">Coming soon</span></div>`;
    } else if (r.avg === null) {
      html += `<div class="result-row"><span>${f.label}<small>No questions answered</small></span><span class="score">–</span></div>`;
    } else {
      html += `<div class="result-row"><span>${f.label}<small>${r.answered} of ${r.total} answered</small></span><span class="score">${r.avg.toFixed(1)} / ${MAX_SCORE}</span></div>`;
    }
  });
  document.getElementById('results').innerHTML = html;
  window.scrollTo(0, 0);
}

function backToAssessment() {
  document.getElementById('graphDisp').classList.add('hidden');
  document.getElementById('CardHolder').classList.remove('hidden');
  document.getElementById('displayed').classList.remove('hidden');
  goToSlide(1);
}

buildSlides();
goToSlide(1);
</script>
</body>
</html>

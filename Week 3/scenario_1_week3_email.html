<!--
  Outlook-style email activity: two emails (toggle between them) with an open reply box.
  Replies autosave to localStorage (one key per email) and also save on the Save button.
  Self-contained: copy this whole block (style, markup, script) into your page.
  To edit the emails or questions, change the EMAILS array at the top of the script.
-->
<style>
  .outlook-mock {
    font-family: "Segoe UI", "Segoe UI Web", Arial, sans-serif;
    max-width: 700px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #d1d1d1;
    border-radius: 2px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    color: #1b1b1b;
    font-size: 14px;
  }

  /* Title bar */
  .outlook-mock__titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f3f2f1;
    border-bottom: 1px solid #d1d1d1;
    padding: 6px 12px;
    border-radius: 2px 2px 0 0;
  }
  .outlook-mock__dot { width: 10px; height: 10px; border-radius: 50%; }
  .outlook-mock__dot--red { background: #ff5f57; }
  .outlook-mock__dot--yellow { background: #febc2e; }
  .outlook-mock__dot--green { background: #28c840; }
  .outlook-mock__titlebar-text { margin-left: 6px; font-size: 12px; color: #605e5c; }

  /* Inbox tabs (toggle between emails) */
  .outlook-mock__tabs {
    display: flex;
    background: #faf9f8;
    border-bottom: 1px solid #edebe9;
  }
  .outlook-mock__tab {
    flex: 1 1 0;
    min-width: 0;
    text-align: left;
    font-family: inherit;
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    border-right: 1px solid #edebe9;
    padding: 10px 16px;
    cursor: pointer;
    color: #605e5c;
  }
  .outlook-mock__tab:last-child { border-right: none; }
  .outlook-mock__tab:hover { background: #f3f2f1; }
  .outlook-mock__tab[aria-selected="true"] {
    background: #ffffff;
    border-bottom-color: #0078d4;
    color: #201f1e;
  }
  .outlook-mock__tab-from { display: block; font-size: 13px; font-weight: 600; }
  .outlook-mock__tab-subject {
    display: block;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Toolbar */
  .outlook-mock__toolbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 8px 16px;
    border-bottom: 1px solid #edebe9;
    background: #ffffff;
    flex-wrap: wrap;
  }
  .outlook-mock__toolbar-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: #323130;
    cursor: default;
  }
  .outlook-mock__toolbar-icon { width: 16px; height: 16px; display: inline-block; border-radius: 2px; }
  .outlook-mock__toolbar-icon--reply { background: #0078d4; }
  .outlook-mock__toolbar-icon--replyall { background: #106ebe; }
  .outlook-mock__toolbar-icon--forward { background: #005a9e; }
  .outlook-mock__toolbar-icon--delete { background: #a4262c; }
  .outlook-mock__toolbar-icon--flag { background: #d83b01; }

  /* Message header */
  .outlook-mock__header { padding: 16px 20px 12px 20px; border-bottom: 1px solid #edebe9; }
  .outlook-mock__subject { font-size: 20px; font-weight: 600; color: #201f1e; margin: 0 0 12px 0; }
  .outlook-mock__row { display: flex; align-items: flex-start; gap: 12px; }
  .outlook-mock__avatar {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 15px;
  }
  .outlook-mock__from-block { flex: 1 1 auto; min-width: 0; }
  .outlook-mock__from-name { font-weight: 600; font-size: 14px; color: #201f1e; }
  .outlook-mock__from-email { font-size: 12.5px; color: #605e5c; }
  .outlook-mock__to-line { font-size: 12.5px; color: #605e5c; margin-top: 2px; }
  .outlook-mock__timestamp { flex: 0 0 auto; font-size: 12.5px; color: #605e5c; white-space: nowrap; }

  /* Body */
  .outlook-mock__body { padding: 20px; line-height: 1.55; color: #201f1e; }
  .outlook-mock__body p { margin: 0 0 14px 0; }
  .outlook-mock__body p:last-child { margin-bottom: 0; }
  .outlook-mock__signoff { font-weight: 600; }

  /* Open reply area */
  .outlook-mock__reply {
    border-top: 1px solid #edebe9;
    background: #faf9f8;
    padding: 14px 20px 16px 20px;
    border-radius: 0 0 2px 2px;
  }
  .outlook-mock__reply-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: #605e5c;
    margin-bottom: 10px;
  }
  .outlook-mock__reply-head strong { color: #201f1e; font-weight: 600; }
  .outlook-mock__question {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    color: #201f1e;
    margin: 0 0 8px 0;
  }
  .outlook-mock__textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 150px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    color: #201f1e;
    background: #ffffff;
    border: 1px solid #8a8886;
    border-radius: 2px;
    resize: vertical;
  }
  .outlook-mock__textarea:focus {
    outline: none;
    border-color: #0078d4;
    box-shadow: 0 0 0 1px #0078d4;
  }
  .outlook-mock__actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }
  .outlook-mock__saved {
    font-size: 13px;
    color: #107c10;
    opacity: 0;
    transition: opacity 0.4s ease;
    margin: 0;
    min-width: 60px;
  }
  .outlook-mock__send {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    background: #0078d4;
    border: none;
    border-radius: 2px;
    padding: 7px 18px;
    cursor: pointer;
  }
  .outlook-mock__send:hover { background: #106ebe; }

  @media (max-width: 520px) {
    .outlook-mock__row { flex-wrap: wrap; }
    .outlook-mock__timestamp { width: 100%; padding-left: 52px; }
  }
</style>

<div class="outlook-mock" id="outlookMock">

  <div class="outlook-mock__titlebar">
    <span class="outlook-mock__dot outlook-mock__dot--red"></span>
    <span class="outlook-mock__dot outlook-mock__dot--yellow"></span>
    <span class="outlook-mock__dot outlook-mock__dot--green"></span>
    <span class="outlook-mock__titlebar-text">Inbox &mdash; Outlook</span>
  </div>

  <!-- Tabs are built by the script -->
  <div class="outlook-mock__tabs" id="omTabs" role="tablist"></div>

  <div class="outlook-mock__toolbar">
    <span class="outlook-mock__toolbar-item"><span class="outlook-mock__toolbar-icon outlook-mock__toolbar-icon--reply"></span>Reply</span>
    <span class="outlook-mock__toolbar-item"><span class="outlook-mock__toolbar-icon outlook-mock__toolbar-icon--replyall"></span>Reply All</span>
    <span class="outlook-mock__toolbar-item"><span class="outlook-mock__toolbar-icon outlook-mock__toolbar-icon--forward"></span>Forward</span>
    <span class="outlook-mock__toolbar-item"><span class="outlook-mock__toolbar-icon outlook-mock__toolbar-icon--delete"></span>Delete</span>
    <span class="outlook-mock__toolbar-item"><span class="outlook-mock__toolbar-icon outlook-mock__toolbar-icon--flag"></span>Flag</span>
  </div>

  <div class="outlook-mock__header">
    <p class="outlook-mock__subject" id="omSubject"></p>
    <div class="outlook-mock__row">
      <div class="outlook-mock__avatar" id="omAvatar"></div>
      <div class="outlook-mock__from-block">
        <div class="outlook-mock__from-name" id="omFromName"></div>
        <div class="outlook-mock__from-email" id="omFromEmail"></div>
        <div class="outlook-mock__to-line" id="omTo"></div>
      </div>
      <div class="outlook-mock__timestamp" id="omTime"></div>
    </div>
  </div>

  <div class="outlook-mock__body" id="omBody"></div>

  <!-- Reply area, always open -->
  <div class="outlook-mock__reply">
    <div class="outlook-mock__reply-head">
      <strong>Reply</strong> to <span id="omReplyTo"></span>
    </div>
    <p class="outlook-mock__question" id="omQuestion"></p>
    <textarea class="outlook-mock__textarea" id="omReplyInput" aria-labelledby="omQuestion"></textarea>
    <div class="outlook-mock__actions">
      <p class="outlook-mock__saved" id="omSavedMsg">Saved!</p>
      <button type="button" class="outlook-mock__send" id="omSaveBtn">Save</button>
    </div>
  </div>

</div>

<script>
(function () {

  /* =====================
      EMAIL CONTENT
      Edit the text, questions and storage keys here.
      Email 2 is placeholder content, so swap in your own.
  ===================== */
  const EMAILS = [
    {
      storageKey: "hrEmail1",
      tabFrom: "HR Email",
      subject: "Us @ work updates",
      initials: "JM",
      avatarColor: "#c4314b",
      fromName: "Jordan Matthews",
      fromEmail: "jordan.matthews@people.com",
      to: "To: Leaders",
      time: "Tue 9:41 AM",
      paragraphs: [
        "Hi team leaders, We have officially introduced Us @ Work – our new all-in-one HR and payroll platform! Thank you to everyone for their feedback and support during the launch.",
        "We are operating in a very high-pressure, high-stakes environment, which means that knowing who is at work and when is crucial for completing tasks and staying on top of what needs to be done. Us @ Work simplifies the process of applying for leave and makes it easier than ever for leaders to keep track of their teams.",
        "As team leaders, you are expected to implement these procedures within your teams and ensure everyone follows the updated requirements. Please direct team members to the revised guidelines for staff benefits and reinforce the importance of following the correct process.",
        "This revised process includes additional steps and consistent monitoring of leave usage to ensure requests are managed fairly and business needs are met.",
        "Please do not allow unauthorised leave or other absence from work without documenting these changes with Us @ Work.",
      ],
      signoff: "If you have any questions regarding these new requirements, please don’t hesitate to reach out.",
      question: "How would you feel about this organisational change, and how might your reaction influence the way your team responds?"
    },
    {
      storageKey: "hrEmail2",
      tabFrom: "Audrey Chang",
      subject: "Concerning Us @ work",
      initials: "AC",
      avatarColor: "#0078d4",
      fromName: "Audrey Chang",
      fromEmail: "audrey.chang@support.com",
      to: "To: Direct manager",
      time: "Tue 2:15 PM",
      paragraphs: [
        "Hi,",
        "I wanted to raise something with you – I have several hours in lieu this week that I was going to use for a dentist appointment, but now I’m worried that I’ll have to file it with the new HR platform and have to take leave. Can I just take the time off and then work late instead? The previous process was a lot better for organising my appointments, and I always made up the time afterwards.",
      ],
      signoff: "Thanks, Audrey",
      question: "How would you adapt your leadership approach to respond to your team’s concerns while still meeting organisational expectations?"
    }
  ];

  /* =====================
      STORAGE HELPERS
      Fail quietly if localStorage is blocked.
  ===================== */
  const store = {
    get(k)    { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };

  /* =====================
      ELEMENTS
  ===================== */
  const $ = (id) => document.getElementById(id);
  const tabsEl   = $("omTabs");
  const textArea = $("omReplyInput");
  const saveBtn  = $("omSaveBtn");
  const savedMsg = $("omSavedMsg");

  let current = 0;
  let timer = null;
  let fadeTimer = null;

  /* =====================
      TABS
  ===================== */
  EMAILS.forEach((email, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "outlook-mock__tab";
    btn.setAttribute("role", "tab");

    const from = document.createElement("span");
    from.className = "outlook-mock__tab-from";
    from.textContent = email.tabFrom;

    const subj = document.createElement("span");
    subj.className = "outlook-mock__tab-subject";
    subj.textContent = email.subject;

    btn.appendChild(from);
    btn.appendChild(subj);
    btn.addEventListener("click", () => showEmail(i));
    tabsEl.appendChild(btn);
  });

  /* =====================
      SAVE FEEDBACK
  ===================== */
  function flashSaved() {
    savedMsg.style.opacity = "1";
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(() => { savedMsg.style.opacity = "0"; }, 1500);
  }

  // Write the current reply straight away (used before switching emails)
  function saveNow() {
    clearTimeout(timer);
    store.set(EMAILS[current].storageKey, textArea.value);
  }

  /* =====================
      SHOW AN EMAIL
  ===================== */
  function showEmail(i) {
    if (i !== current) saveNow();   // don't lose a reply typed in the last 600ms
    current = i;
    const e = EMAILS[i];

    Array.from(tabsEl.children).forEach((btn, idx) => {
      btn.setAttribute("aria-selected", idx === i ? "true" : "false");
    });

    $("omSubject").textContent   = e.subject;
    $("omAvatar").textContent    = e.initials;
    $("omAvatar").style.background = e.avatarColor;
    $("omFromName").textContent  = e.fromName;
    $("omFromEmail").textContent = e.fromEmail;
    $("omTo").textContent        = e.to;
    $("omTime").textContent      = e.time;

    const body = $("omBody");
    body.innerHTML = "";
    e.paragraphs.forEach((text) => {
      const p = document.createElement("p");
      p.textContent = text;
      body.appendChild(p);
    });
    const sign = document.createElement("p");
    sign.className = "outlook-mock__signoff";
    sign.textContent = e.signoff;
    body.appendChild(sign);

    $("omReplyTo").textContent = e.fromName + " (" + e.fromEmail + ")";
    $("omQuestion").textContent = e.question;

    savedMsg.style.opacity = "0";
    textArea.value = store.get(e.storageKey) || "";
  }

  /* =====================
      SAVING
  ===================== */
  // Manual save
  saveBtn.addEventListener("click", () => {
    saveNow();
    flashSaved();
  });

  // Autosave while typing (debounced, untrimmed so spaces aren't lost)
  textArea.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (store.set(EMAILS[current].storageKey, textArea.value)) flashSaved();
    }, 600);
  });

  // Save if the page is closed or hidden mid-typing
  window.addEventListener("pagehide", saveNow);

  showEmail(0);

})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clearview — Company reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<style>

/* =====================
    COLOUR TOKENS
===================== */
:root {
    --AIMblue: #0d705d;
    --darkBlue: #095444;
    --teal: #4bc6b1;
    --tealDark: #0d705d;
    --cream: #F1EEDE;
    --rust: #AF4510;
    --navy: #0d705d;
    --white: #ffffff;
    --bg-app:          #f0ede8;
    --bg-panel:        #ffffff;
    --bg-input:        #f5f3f0;
    --bg-avatar-blue:  #c3ede4;
    --bg-avatar-teal:  #9fe1cb;
    --text-primary:    #1a1a1a;
    --text-secondary:  #666660;
    --text-muted:      #999994;
    --text-avatar-blue:#0d705d;
    --text-avatar-teal:#085041;
    --border-subtle:   #dedad3;
    --border-medium:   #ccc8c0;
    --radius-sm:  6px;
    --radius-md:  8px;
    --radius-lg:  12px;
    --radius-pill:99px;
    --star-empty:  #d8d5cc;
    --star-fill:   #E0A63E;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

.bluegumBody {
    font-family: "IBM Plex Sans", sans-serif;
    background-color: var(--bg-app);
    color: var(--text-primary);
        margin: auto 250px;
}

/* ===================== NAVBAR ===================== */
.navbar {
    /* position: fixed; */
    top: 0; left: 0; width: 100%; height: 64px;
    background-color: white;
    display: flex;
    align-items: center;
    padding: 0 40px;
    z-index: 1000;
    border-bottom: 1px solid var(--border-subtle);
}

.logo { display: flex; align-items: center; gap: 6px; }
.logo-mark { display: flex; align-items: center; }
.logo-mark svg { display: block; }
.logo-word {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.02em;
}
.logo-tagline {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
    margin-left: 16px;
    padding-left: 16px;
    border-left: 1px solid var(--border-subtle);
}
.navbar svg {
    width: 150px;
    display: block;
}
/* ===================== LAYOUT ===================== */
.container {
    display: flex;
    max-width: 1100px;
    margin: 84px auto 40px;
    align-items: flex-start;
    justify-content: center;
    gap: 24px;
    padding: 0 20px;
}

.middle-panel { flex: 1; max-width: 720px; min-width: 0; }
.right-panel { width: 300px; flex-shrink: 0; }

.panel-heading {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    padding: 0 4px 12px;
}
.panel-subheading {
    font-size: 12px;
    color: var(--text-muted);
    padding: 0 4px 14px;
    margin-top: -8px;
}

/* ===================== COMPANY HEADER ===================== */
.company-header {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 22px 24px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
}
.company-logo {
    width: 56px; height: 56px; min-width: 56px;
    border-radius: var(--radius-md);
    background-color: var(--bg-avatar-blue);
    color: var(--text-avatar-blue);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700;
}
.company-header h2 { font-size: 21px; }
.company-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }

/* ===================== TAB BAR ===================== */
.tab-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
}
.tab-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    background-color: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-pill);
    padding: 8px 18px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.tab-btn:hover { border-color: var(--teal); }
.tab-btn.active {
    background-color: var(--AIMblue);
    border-color: var(--AIMblue);
    color: var(--white);
}

/* ===================== TAB CONTENT PANEL ===================== */
.tab-panel {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    min-height: 200px;
}

.empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 10px; }

/* --- reviews feed --- */
.reviews-list { display: flex; flex-direction: column; gap: 14px; }
.feed-review { display: flex; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); }
.feed-review:last-child { border-bottom: none; padding-bottom: 0; }
.avatar {
    width: 38px; height: 38px; min-width: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
}
.avatar.teal { background-color: var(--bg-avatar-teal); color: var(--text-avatar-teal); }
.avatar.blue { background-color: var(--bg-avatar-blue); color: var(--text-avatar-blue); }
.feed-body { flex: 1; }
.feed-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.feed-name { font-size: 13px; font-weight: 600; }
.feed-date {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--AIMblue);
    background-color: var(--bg-avatar-blue);
    border-radius: var(--radius-pill);
    padding: 4px 12px;
    white-space: nowrap;
}
.feed-stars { font-size: 12px; letter-spacing: 1px; margin-top: 2px; }
.feed-stars .filled, .category-stars .filled { color: var(--star-fill); }
.feed-stars .empty,  .category-stars .empty  { color: var(--star-empty); }
.feed-title { font-size: 14px; font-weight: 700; margin-top: 6px; line-height: 1.4; }
.feed-tenure { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.feed-line { font-size: 13px; margin-top: 8px; line-height: 1.5; }
.feed-line .tag { font-weight: 600; color: var(--text-secondary); }
.feed-pros .tag { color: var(--tealDark); }
.feed-cons .tag { color: var(--rust); }
.feed-meta { display: flex; gap: 14px; margin-top: 8px; }
.feed-meta span { font-size: 12px; color: var(--text-muted); cursor: pointer; }
.feed-meta span:hover { color: var(--AIMblue); }
.feed-meta span.liked { color: var(--teal); font-weight: 600; }

/* --- jobs / salaries lists --- */
.simple-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border-subtle);
}
.simple-row:last-child { border-bottom: none; }
.simple-row-title { font-size: 13px; font-weight: 600; }
.simple-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.simple-row-value { font-size: 13px; color: var(--text-secondary); text-align: right; }

/* --- benefits / culture --- */
.pill-list { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-list span {
    font-size: 12px; background-color: var(--bg-input);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-pill);
    padding: 6px 14px;
}
.culture-para { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; }
.culture-para:last-child { margin-bottom: 0; }

/* --- photos --- */
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-tile {
    aspect-ratio: 4/3; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--white); font-weight: 600; text-align: center; padding: 8px;
}

/* ===================== RIGHT PANEL ===================== */
.rating-summary {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}
.rating-circle {
    width: 84px; height: 84px; min-width: 84px; border-radius: 50%;
    background-color: var(--cream);
    border: 3px solid var(--AIMblue);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 0.15s ease;
}
.rating-circle .num { font-size: 20px; font-weight: 700; color: var(--navy); line-height: 1; }
.rating-circle .of5 { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.rating-summary-text { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

.categories-card {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    margin-bottom: 16px;
}
.category-row { padding: 9px 0; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
.category-row:last-child { border-bottom: none; padding-bottom: 0; }
.category-row:first-child { padding-top: 0; }
.category-label { font-size: 13px; }
.category-stars { font-size: 12px; letter-spacing: 1px; }

/* --- leave a review composer --- */
.composer-card {
    background-color: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 16px 18px;
}
.composer-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.star-picker { display: flex; gap: 4px; margin-bottom: 12px; }
.star-picker span { font-size: 22px; color: var(--star-empty); cursor: pointer; line-height: 1; }
.star-picker span.selected { color: var(--star-fill); }
.field-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; display: block; }
textarea.composer-input, input.composer-input {
    width: 100%; font-family: inherit; font-size: 13px; color: var(--text-primary);
    background-color: var(--bg-input); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm); padding: 8px 10px; resize: none; margin-bottom: 12px;
}
textarea.composer-input { min-height: 54px; }
textarea.composer-input:focus, input.composer-input:focus { outline: none; border-color: var(--AIMblue); background-color: var(--white); }
.post-comment-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--white);
    background-color: var(--AIMblue); border: none; border-radius: var(--radius-pill);
    padding: 8px 0; width: 100%; cursor: pointer;
}
.post-comment-btn:disabled { background-color: var(--border-medium); cursor: not-allowed; }
.post-comment-btn:not(:disabled):hover { background-color: var(--darkBlue); }
.composer-hint { font-size: 11px; color: var(--text-muted); margin-top: 8px; text-align: center; }

@media (max-width: 980px) {
    .container { flex-direction: column; }
    .middle-panel, .right-panel { width: 100%; max-width: 100%; }
}
.bluegumBody {
  margin: auto 50px;
}
</style>

    <section class="right-panel">

        <div class="rating-summary">
            <div class="rating-circle">
                <div class="num" id="overallScore">–</div>
                <div class="of5">out of 5</div>
            </div>
            <div class="rating-summary-text">Based on <span id="reviewCount">0</span> employee reviews across 5 key areas.</div>
        </div>

        <div class="categories-card" id="categoriesCard"></div>

          <!-- <div class="composer-card">
          <div class="composer-title">Leave a review</div>
            <div class="star-picker" id="starPicker"></div>
            <label class="field-label" for="titleInput">Headline</label>
            <input class="composer-input" id="titleInput" placeholder="Sum it up in a sentence" oninput="toggleSubmit()" />
            <label class="field-label" for="prosInput">Pros</label>
            <textarea class="composer-input" id="prosInput" placeholder="What worked well?" oninput="toggleSubmit()"></textarea>
            <label class="field-label" for="consInput">Cons</label>
            <textarea class="composer-input" id="consInput" placeholder="What could be better?" oninput="toggleSubmit()"></textarea>
            <button class="post-comment-btn" id="submitBtn" onclick="submitReview()" disabled>Post review</button>
            <div class="composer-hint">Your review appears at the top of the Reviews tab.</div> 
        </div>-->
    </section>

</div>

<script>

/* =====================================================
   DATA — everything below is the single source of truth.
   Edit these arrays/objects to change what's on the page;
   every render function reads from here, nothing is hard-coded
   into the markup.
===================================================== */

const ratingCategories = [
    { label: "Management",         score: 2.4 },
    { label: "Culture",            score: 3.3 },
    { label: "Work-life balance",  score: 2.8 },
    { label: "Compensation",       score: 3.2 },
    { label: "Career growth",      score: 2.9 }
];

const jobs = [
    { title: "Site Supervisor",            location: "Melbourne, AU · Full-time",  posted: "4d ago" },
    { title: "Project Administrator",      location: "Sydney, AU · Full-time",     posted: "1w ago" },
    { title: "Qualified Electrician",      location: "Geelong, AU · Contract",     posted: "2w ago" }
];

const salaries = [
    { role: "Site Supervisor",       range: "$105k – $135k" },
    { role: "Project Manager",       range: "$130k – $170k" },
    { role: "Project Administrator", range: "$70k – $88k"   }
];

const benefits = [
    "Site allowances", "RDO calendar", "Income protection cover",
    "Paid parental leave", "Apprenticeship support", "EAP counselling"
];

const culture = [
    "Longer-tenured staff describe a genuine team mentality on site, with managers who historically adjusted plans when crews raised legitimate safety or scheduling concerns.",
    "Recent reviews are dominated by a rapid rollout of new digital systems for reporting, documentation, communication and approvals. Reviewers say the platforms overlap, duplicate data entry and were introduced with limited training.",
    "The recurring theme is consultation rather than technology: experienced supervisors, admin staff and trades report that their feedback was read as resistance to change, and several link this to a decline in trust in leadership."
];

const photos = [
    { label: "Melbourne HQ",   color: "#4353A3" },
    { label: "Site induction", color: "#5DC8B9" },
    { label: "Fitout project", color: "#AF4510" }
];

// Employee review feed — data-driven. The feed is sorted chronologically
// (newest first) at render time, so array order doesn't matter. The overall
// rating (right panel) is derived live from this array every time it changes.
let reviews = [
    { id: 1, name: "Former Consultant", initials: "FC", avatarStyle: "teal", rating: 2,
      tenure: "Five years as a consultant",
      title: "Change is happening faster than the people can adapt",
      pros: "Sometimes we had pizza parties and ice cream. I like my colleagues.",
      cons: "Bluegum says the new technology will make building faster and safer, but the reality on the ground has been very different. New processes are introduced so quickly that many of us are still trying to understand how they affect our roles. The people who actually use these systems every day don’t seem to have much input into the decisions. We’ve raised concerns about the project quality and why these processes were created in the first place and for good reason, but it feels like the decisions have already been made. There’s also a divide between the teams pushing for change and those of us who want to be more careful. The technology itself isn’t necessarily the problem, but the lack of consultation and the assumption that changing things automatically changes the way people work is already causing problems. I hope leadership takes the feedback seriously before things escalate.",
      timestamp: new Date("2026-09-11T08:03:00"), liked: false },

    { id: 2, name: "Former Electrician", initials: "FE", avatarStyle: "blue", rating: 1,
      tenure: "Eight years as an electrician",
      title: "They introduced a bunch of fancy crap without understanding how it works",
      pros: "Met some great people working here. Clients, contractors and permanent staff were some of the best in the business, and I learned a lot while I worked here.",
      cons: "Bluegum has gone from being very people-focused to being obsessed with fancy new digital processes. New systems have been rolled out across all current projects without actually consulting supervisors, project teams or administration staff. We have new systems for project reporting, documentation, communication and approvals. The problem is many of these systems overlap each other. Simple tasks take much longer. Some of these tools might eventually expedite project completion but right now they're only making more work for everyone. People were spending time entering information into different systems and correcting errors and neglecting client relationships and project oversight. What's especially disappointing is that concerns raised by us were treated as resistance to change rather than useful feedback. People who have been with the company for years understand how our projects and clients actually operate but our experience wasn't really considered before the changes were made. Overall, there's a massive decline in the trust in leadership here.",
      timestamp: new Date("2026-09-08T16:20:00"), liked: false },

    { id: 3, name: "Former Client Rep", initials: "CR", avatarStyle: "teal", rating: 2,
      tenure: "Two years as a client rep",
      title: "Too much change too quickly",
      pros: "Flexible hours and overall supportive team environment. Very valuable for career development and allowed me to finish my degree while working here.",
      cons: "Before I left, the company suddenly introduced a range of new digital systems with little input from the people who were expected to actually use them. Modernising the business isn't necessarily a bad idea, but the implementation has been very rushed. We were expected to use multiple new platforms with limited instruction, and staff were told what to do rather than given the opportunity to provide input about what would work best on site or with clients. There seems to be an assumption that digital = better. It's particularly frustrating because there is a huge amount of practical knowledge within the company. Experienced employees know which processes work on a live construction project and which don't. That knowledge should have been used. Most of this could have probably been avoided by trialling this system with a few project teams first and fixing the problems before rolling them out company-wide.",
      timestamp: new Date("2026-09-02T11:05:00"), liked: false },

    { id: 4, name: "Former Bricklayer", initials: "BL", avatarStyle: "blue", rating: 2,
      tenure: "Seven years as a bricklayer",
      title: "We used to feel like a team.",
      pros: "Leadership.",
      cons: "This is a very different team from the one I joined. There has been a total breakdown of communication in the company, so it is much, much harder for staff and contractors to address any issues onsite. Leadership has been pushing new processes that just create more backlog and stress. There has been a lot of duplication and frustration between different teams. People are being pressured to meet new expectations that were never communicated, and project teams are trying to keep clients happy and meet deadlines at the same time. The biggest loss has been the camaraderie at the company. We used to solve problems by talking to each other. Now everyone is more worried about managing the new workload or following the correct process. Experienced workers don't feel valued.",
      timestamp: new Date("2026-08-26T09:40:00"), liked: false },

    { id: 5, name: "Lead Admin", initials: "LA", avatarStyle: "teal", rating: 4,
      tenure: "Seven years as a lead admin",
      title: "Good people and a positive team environment",
      pros: "The best thing about this company is the people. There's a genuine team mentality, and managers generally make an effort to listen to team members and understand what's happening on site and in the office. Client satisfaction is also taken seriously without just expecting us to say yes to everything. There's a good balance between getting the job done and looking after the people doing it. Health and career longevity is always a concern for people working in construction, so it's great when managers change plans after staff raise legitimate concerns.",
      cons: "Some processes could be more consistent across different projects. Sometimes struggle to communicate with others off-site because of the slow response time.",
      timestamp: new Date("2024-09-18T14:12:00"), liked: false },

    { id: 6, name: "Project Manager", initials: "PM", avatarStyle: "blue", rating: 5,
      tenure: "Thirteen years as a project manager",
      title: "A company that really cares about people",
      pros: "Leadership understands that this industry is ultimately about people, not just projects and deadlines. Our staff were supported when challenges arose, and there is a strong emphasis that everyone's contributions matter equally. Bluegum also takes a lot of pride in their relationships with clients. We're encouraged to develop a rapport and communicate openly with clients, staff and the leadership team. It creates a good culture where you feel trusted to do your job.",
      cons: "We had a really hard time communicating across different sites. There was no strictly regulated process, so we spent a lot of time shouting at each other on the phone while driving in different directions. We always got the job done, but it was a bit of a time sink when you couldn't keep track of who had talked to who, and what they'd said.",
      timestamp: new Date("2023-01-05T10:30:00"), liked: false }
];
let nextId = reviews.length + 1;

const tabs = [
    { key: "reviews",  label: "Reviews"  },
    { key: "jobs",     label: "Jobs"     },
    { key: "salaries", label: "Salaries" },
    { key: "benefits", label: "Benefits" },
    { key: "culture",  label: "Culture"  }
];
let activeTab = "reviews";
let selectedStars = 0;

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

function starString(rating, cls) {
    let out = "";
    for (let i = 1; i <= 5; i++) {
        out += `<span class="${i <= Math.round(rating) ? "filled" : "empty"}">★</span>`;
    }
    return `<span class="${cls || ""}">${out}</span>`;
}

// Month + year shown on each review, e.g. "September 2026"
// Relative date shown on each review, e.g. "3 months ago" or "2 years ago"
function formatTimeAgo(date) {
    const now = new Date();

    // Full calendar months elapsed between the review date and now
    let months = (now.getFullYear() - date.getFullYear()) * 12
               + (now.getMonth() - date.getMonth());
    if (now.getDate() < date.getDate()) months--;   // hasn't hit the same day-of-month yet

    if (months < 1)  return "Less than a month ago";
    if (months < 12) return months === 1 ? "1 month ago" : `${months} months ago`;

    const years = Math.floor(months / 12);
    return years === 1 ? "1 year ago" : `${years} years ago`;
}

/* =====================================================
   RENDER — RATINGS (right panel)
   overallAverage() is recomputed from the live `reviews` array
   every time it's called, so the score always reflects the
   current set of reviews, including any just submitted.
===================================================== */
function overallAverage() {
    const catAvg = ratingCategories.reduce((s, c) => s + c.score, 0) / ratingCategories.length;
    if (reviews.length === 0) return catAvg;
    const reviewAvg = reviews.reduce((s, r) => s + r.rating, 0) / reviews.length;
    return (catAvg + reviewAvg) / 2;
}

function renderRatingSummary() {
    document.getElementById("overallScore").textContent = overallAverage().toFixed(1);
    document.getElementById("reviewCount").textContent = reviews.length;
}

function renderCategories() {
    document.getElementById("categoriesCard").innerHTML = ratingCategories.map(c => `
        <div class="category-row">
            <div class="category-label">${escapeHtml(c.label)}</div>
            <div class="category-stars">${starString(c.score)}</div>
        </div>
    `).join("");
}

function renderStarPicker() {
    const picker = document.getElementById("starPicker");
    picker.innerHTML = [1,2,3,4,5].map(i => `
        <span class="${i <= selectedStars ? "selected" : ""}" onclick="setStars(${i})">★</span>
    `).join("");
}

function setStars(n) {
    selectedStars = n;
    renderStarPicker();
    toggleSubmit();
}

function toggleSubmit() {
    const pros = document.getElementById("prosInput").value.trim();
    const cons = document.getElementById("consInput").value.trim();
    document.getElementById("submitBtn").disabled = !(selectedStars > 0 && (pros || cons));
}

function submitReview() {
    const title = document.getElementById("titleInput").value.trim();
    const pros = document.getElementById("prosInput").value.trim();
    const cons = document.getElementById("consInput").value.trim();
    if (!(selectedStars > 0 && (pros || cons))) return;

    // The feed is sorted by timestamp at render time, so a new review
    // lands at the top (newest) automatically.
    reviews.push({
        id: nextId++,
        name: "You",
        initials: "You",
        avatarStyle: "blue",
        rating: selectedStars,
        tenure: "",
        title, pros, cons,
        timestamp: new Date(),
        liked: false
    });

    document.getElementById("titleInput").value = "";
    document.getElementById("prosInput").value = "";
    document.getElementById("consInput").value = "";
    selectedStars = 0;
    renderStarPicker();
    toggleSubmit();

    // Re-derive and re-render the overall rating immediately so it
    // reflects the review that was just added.
    renderRatingSummary();

    activeTab = "reviews";
    renderTabBar();
    renderTabPanel();
}

function likeReview(id) {
    const r = reviews.find(r => r.id === id);
    if (!r) return;
    r.liked = !r.liked;
    renderTabPanel();
}

/* =====================================================
   RENDER — TAB BAR + TAB CONTENT (middle panel)
===================================================== */
function renderTabBar() {
    document.getElementById("tabBar").innerHTML = tabs.map(t => `
        <button class="tab-btn ${t.key === activeTab ? "active" : ""}" onclick="switchTab('${t.key}')">${escapeHtml(t.label)}</button>
    `).join("");
}

function switchTab(key) {
    activeTab = key;
    renderTabBar();
    renderTabPanel();
}

function renderTabPanel() {
    const panel = document.getElementById("tabPanel");
    panel.innerHTML = tabContent[activeTab]();
}

const tabContent = {
    reviews: () => {
        if (reviews.length === 0) return `<div class="empty-state">No reviews yet. Be the first to leave one.</div>`;
        // Newest first. Swap to (a - b) for oldest first.
        const sorted = [...reviews].sort((a, b) => b.timestamp - a.timestamp);
        return `<div class="reviews-list">${sorted.map(r => `
            <div class="feed-review">
                <div class="avatar ${r.avatarStyle}">${escapeHtml(r.initials)}</div>
                <div class="feed-body">
                    <div class="feed-top">
                        <div class="feed-name">${escapeHtml(r.name)}</div>
                        <div class="feed-date">${escapeHtml(formatTimeAgo(r.timestamp))}</div>
                    </div>
                    <div class="feed-stars">${starString(r.rating)}</div>
                    ${r.title ? `<div class="feed-title">${escapeHtml(r.title)}</div>` : ""}
                    ${r.tenure ? `<div class="feed-tenure">${escapeHtml(r.tenure)}</div>` : ""}
                    ${r.pros ? `<div class="feed-line feed-pros"><span class="tag">Pros:</span> ${escapeHtml(r.pros)}</div>` : ""}
                    ${r.cons ? `<div class="feed-line feed-cons"><span class="tag">Cons:</span> ${escapeHtml(r.cons)}</div>` : ""}
                    <div class="feed-meta">
                        <span class="${r.liked ? "liked" : ""}" onclick="likeReview(${r.id})">${r.liked ? "Liked" : "Like"}</span>
                    </div>
                </div>
            </div>
        `).join("")}</div>`;
    },
    jobs: () => {
        if (jobs.length === 0) return `<div class="empty-state">No open roles listed yet.</div>`;
        return jobs.map(j => `
            <div class="simple-row">
                <div>
                    <div class="simple-row-title">${escapeHtml(j.title)}</div>
                    <div class="simple-row-sub">${escapeHtml(j.location)}</div>
                </div>
                <div class="simple-row-value">${escapeHtml(j.posted)}</div>
            </div>
        `).join("");
    },
    salaries: () => {
        if (salaries.length === 0) return `<div class="empty-state">No salary data yet.</div>`;
        return salaries.map(s => `
            <div class="simple-row">
                <div class="simple-row-title">${escapeHtml(s.role)}</div>
                <div class="simple-row-value">${escapeHtml(s.range)}</div>
            </div>
        `).join("");
    },
    benefits: () => {
        if (benefits.length === 0) return `<div class="empty-state">No benefits listed yet.</div>`;
        return `<div class="pill-list">${benefits.map(b => `<span>${escapeHtml(b)}</span>`).join("")}</div>`;
    },
    culture: () => {
        if (culture.length === 0) return `<div class="empty-state">No culture notes yet.</div>`;
        return culture.map(p => `<div class="culture-para">${escapeHtml(p)}</div>`).join("");
    },
    photos: () => {
        if (photos.length === 0) return `<div class="empty-state">No photos yet.</div>`;
        return `<div class="photo-grid">${photos.map(p => `
            <div class="photo-tile" style="background-color:${p.color}">${escapeHtml(p.label)}</div>
        `).join("")}</div>`;
    }
};

/* =====================================================
   INIT
===================================================== */
renderRatingSummary();
renderCategories();
// renderStarPicker();
renderTabBar();
renderTabPanel();

</script>
</div>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* =====================
    COLOUR TOKENS
===================== */
:root {
  --AIMblue: #4353A3;
  --darkBlue: #38416D;
  --teal: #5DC8B9;
  --cream: #F1EEDE;
  --grey: #e7e9ec;
  --rust: #AF4510;
  --navy: #12195C;
  --white: #ffffff;
  --lightBlue: #AEBAE4;
  --bg-app:          #f0ede8;
  --bg-sidebar:      #e8e4de;
  --bg-panel:        #ffffff;
  --bg-message-head: #f5f3f0;
  --bg-private-tag:  #fff0ee;
  --bg-unread-dot:   #378add;
  --bg-selected-row: #e6f1fb;
  --bg-badge:        #d85a30;
  --bg-input:        #f5f3f0;

  --text-primary:    #1a1a1a;
  --text-secondary:  #666660;
  --text-muted:      #999994;
  --text-avatar-blue:#0c447c;
  --text-avatar-teal:#085041;
  --text-private:    #993c1d;
  --text-badge:      #ffffff;

  --border-subtle:   #dedad3;
  --border-medium:   #ccc8c0;

  --radius-sm:  6px;
  --radius-md:  8px;
  --radius-lg:  12px;
  --radius-pill:99px;
}

body { font-family: 'Inter', sans-serif; }

.workArea2 {
  font-size: 14px;
  color: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* =====================
    LAYOUT SHELL
===================== */
.mail-app {
  display: flex;
  width: 900px;
  height: 580px;
  border: 1px solid var(--border-medium);
  background: var(--bg-panel);
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}

/* =====================
    SIDEBAR
===================== */
.sidebar {
  width: 100px;
  flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  padding: 16px 0;
  display: flex;
  flex-direction: column;
}
.sidebar-title { font-size: 16px; font-weight: 600; padding: 0 16px 14px; color: var(--text-primary); }
.sidebar-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 16px;
  font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none;
}
.sidebar-item.active { background: var(--bg-panel); color: var(--text-primary); font-weight: 600; }
.sidebar-icon { font-size: 15px; width: 16px; text-align: center; }

.emailInboxThread { display: flex; min-width: 0; flex: 1; }

/* =====================
    INBOX LIST
===================== */
.inbox-list {
  width: 260px;
  flex-shrink: 0;
  border-right: 1px solid var(--border-subtle);
  overflow-y: auto;
  background: var(--bg-panel);
}
.inbox-toolbar {
  display: flex; align-items: center; padding: 12px 14px;
  border-bottom: 1px solid var(--border-subtle); gap: 8px;
}
.inbox-toolbar-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.inbox-toolbar-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }

.email-row { padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); cursor: pointer;  }
.email-row.selected { background: var(--bg-selected-row); opacity: 1; }
.email-row:focus-visible { outline: 2px solid var(--AIMblue); outline-offset: -2px; opacity: 1; }
.email-row-top { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 3px; }
.unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bg-unread-dot); flex-shrink: 0; margin-top: 4px; }
.email-sender { flex: 1; font-size: 13px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.email-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
.email-subject { font-size: 12px; color: var(--text-primary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.email-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* =====================
    THREAD PANE
===================== */
.thread-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-panel); min-width: 0; }
.thread-header { padding: 14px 20px 12px; border-bottom: 1px solid var(--border-subtle); }
.thread-subject { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
.thread-meta { display: flex; align-items: center; gap: 6px; }

.tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-pill); }
.tag-inbox { background: var(--bg-message-head); color: var(--text-secondary); border: 1px solid var(--border-subtle); }

.thread-actions { margin-left: auto; display: flex; gap: 6px; }
.btn {
  background: none; border: 1px solid var(--border-medium); border-radius: var(--radius-md);
  padding: 4px 12px; font-size: 12px; color: var(--text-secondary); cursor: pointer;
}
.btn:hover { background: var(--bg-message-head); }

/* =====================
    MESSAGE CARDS
===================== */
.thread-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

.message-card { border: 1px solid var(--border-subtle); }
.message-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--bg-message-head); border-bottom: 1px solid var(--border-subtle);
}
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.avatar-navy { background: var(--navy); color: white; }
.av-blue   { background: #B5D4F4; color: #0C447C; }
.av-coral  { background: #F5C4B3; color: #712B13; }
.av-purple { background: #9EA2D4; color: #3C3489; }

.message-from { flex: 1; min-width: 0; }
.message-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.message-name-to { font-size: 11px; font-weight: 400; color: var(--text-muted); }
.message-address { font-size: 11px; color: var(--text-muted); }
.message-time { font-size: 11px; color: var(--text-muted); margin-left: 6px; }
.message-body { padding: 12px 14px; font-size: 13px; color: var(--text-primary); line-height: 1.65; }
.message-body p + p { margin-top: 8px; }

/* ── Table inside an email body ── */
.table-wrap { margin: 12px 0; overflow-x: auto; }
.email-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  border: 1px solid var(--border-subtle);
}
.email-table th,
.email-table td {
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
}
.email-table th {
  background: var(--bg-message-head);
  font-weight: 600;
  color: var(--text-primary);
}
.email-table tbody tr:nth-child(even) { background: #faf9f7; }
.email-table tbody tr:last-child td { border-bottom: none; }
.email-table td:last-child,
.email-table th:last-child {
  text-align: center;
  white-space: nowrap;
  width: 110px;
}

.username { text-transform: capitalize; }

/* ── NEW EMAIL ALERT (from the reference file) ── */
svg { fill: white; cursor: pointer; transition: 300ms ease; width: 30px; margin: 5px; }
svg:hover { fill: var(--teal); }

.alertZone { position: relative; width: 900px; max-width: 100%; height: 0; margin: 60px auto 0; z-index: 999; }
ul {
    margin: 15px;
}
.hideMe {
  opacity: 0;
  position: relative;
  left: 20px;
  bottom: 30px;
  transition: opacity 0.5s ease;
  z-index: 999;
  overflow: hidden;
  pointer-events: none;
}
.alertAppear {
  opacity: 1;
  position: relative;
  left: 20px;
  bottom: 30px;
  transition: opacity 0.5s ease;
  z-index: 999;
}
.desktopAlert {
  position: absolute;
  width: 300px;
  min-height: 100px;
  z-index: 999;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.5);
  border-radius: 4px;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 15px;
  text-align: center;
  line-height: 2.5;
  right: 40px;
}
.pulse-alert {
  background-color: var(--navy);
  border: none;
  border-radius: 4px;
  cursor: pointer;
  color: white;
  animation: pulse-border 2s infinite;
}
.pulse-alert:hover { color: var(--navy); background-color: var(--lightBlue); }
.pulse-alert:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

@keyframes pulse-border {
  0%   { box-shadow: 0 0 0 0 #12195C70; }
  70%  { box-shadow: 0 0 0 15px #12195C00; }
  100% { box-shadow: 0 0 0 0 #12195C00; }
}

/* new email sliding into the inbox */
.email-row.arrive { animation: rowIn 0.6s ease; }
@keyframes rowIn {
  from { opacity: 0; transform: translateY(-14px); }
  to   { transform: translateY(0); }
}

@media only screen and (max-width: 767px) {
  .mail-app { margin: auto 40px; height: 90%; flex-direction: column; }
  .inbox-list { width: auto; max-height: 200px; }
  .sidebar { width: auto; flex-direction: row; }
  .emailInboxThread { flex-direction: column; }
  .sidebar-item.active { display: block !important; }
  .sidebar-item { display: none; }
  .thread-pane { max-height: 500px; }
}

.container {
  width: 900px;
  max-width: 100%;
  margin: 0 auto;
  /* padding: 0 20px 40px; */
  display: flex;
  flex-direction: column;
  gap: 20px;
  font-size: 14px;
  color: var(--text-primary);
}

.instructions {
  background: var(--white);
  border: 1px solid var(--border-subtle);
  border-left: 3px solid var(--AIMblue);
  padding: 18px 22px;
  line-height: 1.6;
}
.instructions h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }

.reflection {
  background: var(--white);
  border: 1px solid var(--border-medium);
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.reflection-bar {
  padding: 10px 20px;
  background: var(--bg-message-head);
  border-bottom: 1px solid var(--border-subtle);
  font-size: 13px; font-weight: 600;
}
.question { padding: 20px; border-bottom: 1px solid var(--border-subtle); }
.question-head { display: flex; gap: 12px; margin-bottom: 10px; }
.question-num {
  flex-shrink: 0;
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-selected-row); color: var(--darkBlue);
  font-size: 12px; font-weight: 700;
}
.question-text { max-width: 75ch; font-size: 14px; font-weight: 600; line-height: 1.5; padding-top: 2px; }
.question-text span { display: block; margin-top: 6px; font-weight: 400; color: var(--text-secondary); }

.question textarea {
  display: block;
  width: 100%;
  min-height: 140px;
  padding: 12px 14px;
  font-family: inherit; font-size: 14px; line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  resize: vertical;
}
.question textarea:focus { outline: none; border-color: var(--AIMblue); background: var(--white); }

.reflection-footer {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 20px;
  background: var(--bg-message-head);
}
.savedMsg { font-size: 13px; color: var(--AIMblue); opacity: 0; transition: opacity 0.4s ease; }
.savedMsg.error { color: var(--rust); }
.saveBtn {
  font-family: inherit; font-size: 13px; font-weight: 600;
  color: var(--white); background-color: var(--AIMblue);
  border: none; border-radius: 99px;
  padding: 8px 22px; cursor: pointer;
}
.saveBtn:hover { background-color: var(--darkBlue); }
.saveBtn:focus-visible { outline: 2px solid var(--AIMblue); outline-offset: 2px; }

/* @media only screen and (max-width: 767px) {
  .container { padding: 0 12px 24px; }
  .question { padding: 16px 14px; }
} */
</style>
</head>
<body>

<!-- ── NEW EMAIL ALERT ── -->
<div class="alertZone">
  <div id="emailAlert" class="hideMe" onclick="clickEmailAlert()" tabindex="0" role="button" aria-label="New email. Open inbox">
    <div class="desktopAlert pulse-alert">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><defs><style>.fa-secondary{opacity:.4}</style></defs><path d="M256.47 352h-.94c-30.1 0-60.41-23.42-82.54-40.52C169.39 308.7 24.77 202.7 0 183.33V400a48 48 0 0 0 48 48h416a48 48 0 0 0 48-48V183.36c-24.46 19.17-169.4 125.34-173 128.12-22.12 17.1-52.43 40.52-82.53 40.52zM464 64H48a48 48 0 0 0-48 48v19a24.08 24.08 0 0 0 9.2 18.9c30.6 23.9 40.7 32.4 173.4 128.7 16.8 12.2 50.2 41.8 73.4 41.4 23.2.4 56.6-29.2 73.4-41.4 132.7-96.3 142.8-104.7 173.4-128.7A23.93 23.93 0 0 0 512 131v-19a48 48 0 0 0-48-48z" class="fa-secondary"/><path d="M512 131v52.36c-24.46 19.17-169.4 125.34-173 128.12-22.12 17.1-52.43 40.52-82.53 40.52h-.94c-30.1 0-60.41-23.42-82.54-40.52C169.39 308.7 24.77 202.7 0 183.33V131a24.08 24.08 0 0 0 9.2 18.9c30.6 23.9 40.7 32.4 173.4 128.7 16.69 12.12 49.75 41.4 72.93 41.4h.94c23.18 0 56.24-29.28 72.93-41.4 132.7-96.3 142.8-104.7 173.4-128.7A23.93 23.93 0 0 0 512 131z" class="fa-primary"/></svg>
      <p>New Email</p>
    </div>
  </div>
</div>

<div class="workArea2">
  <div class="mail-app">

    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-title">Mail</div>
      <div class="sidebar-item active"><span class="sidebar-icon">&#9711;</span> Inbox</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#10148;</span> Sent</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#9998;</span> Drafts</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#9707;</span> Archive</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#128465;</span> Trash</div>
    </nav>

    <div class="emailInboxThread">
      <!-- INBOX LIST -->
      <div class="inbox-list" style="display: none;">
        <div class="inbox-toolbar">
          <span class="inbox-toolbar-title">Inbox</span>
          <span class="inbox-toolbar-count" id="inboxCount"></span>
        </div>
        <div id="inboxRows"><!-- built by renderInbox() --></div>
      </div>

      <!-- THREAD PANE -->
      <div class="thread-pane">
        <div id="threadHeader"><!-- built by selectEmail() --></div>
        <div id="threadBody" class="thread-body" tabindex="0"><!-- built by selectEmail() --></div>
      </div>
    </div>

  </div>
</div>

<!-- REFLECTION -->
<div class="container">
  <div class="instructions">
    <h2>Reflection</h2>
    <p>After reading through the different responses, answer the question below. Then, click the <strong>'Download your activity'</strong> button below the questions to save your answers as a PDF.</p>
  </div>

  <div class="reflection" id="questionBox">
    <div class="reflection-bar">Your reflection</div>

    <div class="question">
      <div class="question-head">
        <span class="question-num" aria-hidden="true">1</span>
        <label class="question-text" for="reflect1">From what you have observed in the previous activities, which survey scores do you think may have changed following the organisational restructure?</label>
      </div>
      <textarea id="reflect1" data-q="1"></textarea>
    </div>

    <div class="question">
      <div class="question-head">
        <span class="question-num" aria-hidden="true">2</span>
        <label class="question-text" for="reflect2">How could comparing these results help the organisation identify emerging concerns, recognise improvements and adapt its approach to better meet peoples’ changing needs?</span></label>
      </div>
      <textarea id="reflect2" data-q="2"></textarea>
    </div>

    <div class="reflection-footer">
      <p id="reflectStatus" class="savedMsg" role="status">Saved!</p>
      <button id="reflectSave" class="saveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   LEARNER — name comes from the LMS if it was stored there
   ========================================================= */
function titleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }
let storedName = 'Leader', storedInitial = '';
try {
  storedName = localStorage.getItem('riseUserName') || storedName;
  storedInitial = localStorage.getItem('lastInitialToken') || '';
} catch (e) { /* storage unavailable */ }
const learnerName = titleCase(storedName.trim()) + (storedInitial ? ' ' + storedInitial.toUpperCase() : '');
const learnerEmail = 'teamleader@blackswanminerals.com.au';

/* =========================================================
   DATA — edit the emails here
   Blank line = new paragraph. A single line break stays a line break.
   ========================================================= */
const emails = [
  {
    id: 'hr',
    sender: 'Omar M',
    initials: 'OM',
    avatarClass: 'av-coral',
    address: 'omar.m@blackswanminerals.com.au',
    toName: 'All staff',
    toAddress: 'allstaff@blackswanminerals.com.au',
    time: '8:33 am',
    subject: 'Recognising our progress and listening to our people',
    unread: true,
    body: `Hi everyone,

Thank you for your continued efforts and professionalism as we navigate this organisational change. Our acquisition of OurSphere has brought new opportunities and new challenges for many of our people. I recognise the work being done across the organisation to maintain our standards, support colleagues and help build a stronger business.

As we continue into Q2, it is important that we understand how these changes are affecting our people. You are invited to participate in our You Talk Staff Survey, to reflect on your experiences in the workplace since the restructure and assess where we can improve the way we work together.

Your feedback is so important in identifying areas that are working well, and issues that may require further attention or action. I encourage everyone to participate honestly. As always, the survey is completely anonymous, and your responses will help inform decisions about how we support our people during this transition.

Below are the results of our previous You Talk survey, conducted before the acquisition was announced. Overall, the results were encouraging, and our workforce was proud to be working at Black Swan.

Previous survey results:

[[table]]
Survey statement | Average score
I have clear expectations in place from my leader | 4.0/5
I feel my work is valued by Black Swan | 3.9/5
I feel my team is able to perform at its best. | 4.0/5
I have the tools and resources needed to do my best work. | 3.8/5
I feel supported and recognised by my leader and coworkers. | 4.0/5
The mission and purpose of Black Swan makes my job feel important. | 3.7/5
At work, my opinions seem to count. | 4.2/5
Overall, I am satisfied working at Black Swan. | 4.0/5
[[/table]]

These results showed that our staff felt positive about their teams, leadership and our purpose. However, there were also opportunities to improve, particularly around ensuring staff feel heard, valued and equipped to perform at their best.

As we move into this next chapter, we cannot assume that experiences reflected in previous feedback remains the same. The restructure has changed roles, reporting relationships and team structures. We need to listen to our people and understand what these changes mean in practice.

Thank you for your contribution, adaptability and commitment. I encourage you to take the time to complete the upcoming survey and share your perspective. Your feedback matters, and we have a responsibility to listen and act when necessary.

Kind regards,

Omar

Chief Executive Officer

Black Swan Minerals`
  }
];
// Newest first, as in a real inbox
emails.reverse();
const emailsById = Object.fromEntries(emails.map(e => [e.id, e]));
let selectedId = null;

/* =========================================================
   RENDERING
   ========================================================= */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function tableHtml(block) {
  // block lines: [[table]] / header | header / row | row / ... / [[/table]]
  const rows = block
    .split('\n')
    .map(l => l.trim())
    .filter(l => l && l !== '[[table]]' && l !== '[[/table]]')
    .map(l => l.split('|').map(c => esc(c.trim())));

  if (!rows.length) return '';
  const [head, ...body] = rows;

  return `<div class="table-wrap"><table class="email-table">
    <thead><tr>${head.map(c => `<th scope="col">${c}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function bodyHtml(text) {
  return text.split('\n\n').map(p =>
    p.trim().startsWith('[[table]]')
      ? tableHtml(p)
      : `<p>${esc(p).replace(/\n/g, '<br>')}</p>`
  ).join('');
}
function previewOf(text) {
  const lines = text.split('\n\n');
  return (lines[1] || lines[0]).replace(/\n/g, ' ');
}

let delivered = false;   // becomes true when the learner clicks the New Email alert
let arrivingId = null;   // the row that should animate in on the next render

function renderInbox() {
  const list = emails.filter(e => e.arrival !== 'later' || delivered);
  document.getElementById('inboxCount').textContent =
    list.length + (list.length === 1 ? ' message' : ' messages');
  const arriving = arrivingId;
  arrivingId = null;
  document.getElementById('inboxRows').innerHTML = list.map(e => `
    <div class="email-row${e.id === selectedId ? ' selected' : ''}${e.id === arriving ? ' arrive' : ''}" data-email-id="${e.id}" tabindex="0" role="button">
      <div class="email-row-top">
        ${e.unread ? '<span class="unread-dot"></span>' : ''}
        <span class="email-sender">${esc(e.sender)}</span>
        <span class="email-time">${esc(e.time)}</span>
      </div>
      <div class="email-subject">${esc(e.subject)}</div>
      <div class="email-preview">${esc(previewOf(e.body))}</div>
    </div>`).join('');
}

function selectEmail(id) {
  const e = emailsById[id];
  if (!e) return;
  selectedId = id;
  e.unread = false;

  const toName = e.toName || learnerName;
  const toAddress = e.toAddress || learnerEmail;

  document.getElementById('threadHeader').innerHTML = `
    <div class="thread-header">
      <div class="thread-subject">${esc(e.subject)}</div>
      <div class="thread-meta">
        <span class="tag tag-inbox">Inbox</span>
        <div class="thread-actions">
        
        </div>
      </div>
    </div>`;

  document.getElementById('threadBody').innerHTML = `
    <div class="message-card">
      <div class="message-header">
        <div class="avatar ${e.avatarClass}">${esc(e.initials)}</div>
        <div class="message-from">
          <div class="message-name">${esc(e.sender)} <span class="message-name-to">to ${esc(toName)}</span></div>
          <div class="message-address">${esc(toAddress)}</div>
        </div>
        <span class="message-time">${esc(e.time)}</span>
      </div>
      <div class="message-body">${bodyHtml(e.body)}</div>
    </div>`;
  document.getElementById('threadBody').scrollTop = 0;
  renderInbox();
}

document.getElementById('inboxRows').addEventListener('click', ev => {
  const row = ev.target.closest('.email-row');
  if (row) selectEmail(row.dataset.emailId);
});
document.getElementById('inboxRows').addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const row = ev.target.closest('.email-row');
  if (row) { ev.preventDefault(); selectEmail(row.dataset.emailId); }
});

/* =========================================================
   REFLECTION — answers are stored in localStorage
   (keys: BSSReflectionAnswer1, serenityReflectionAnswer2, serenityReflectionAnswer3)
   ========================================================= */
function flashStatus(text) {
  const el = document.getElementById('omarQ');
  el.textContent = text;
  el.style.opacity = 1;
  clearTimeout(flashStatus.t);
  flashStatus.t = setTimeout(() => { el.style.opacity = 0; }, 3000);
}

function saveAnswer(box) {
  const key = 'omarQ' + box.dataset.q;
  const text = box.value.trim();
  try {
    if (text) localStorage.setItem(key, text);
    else localStorage.removeItem(key);
  } catch (err) { /* storage unavailable */ }
}

document.querySelectorAll('.question textarea').forEach(box => {
  box.addEventListener('input', () => saveAnswer(box));
});

document.getElementById('reflectSave').addEventListener('click', () => {
  document.querySelectorAll('.question textarea').forEach(saveAnswer);
  flashStatus('Saved!');
}); 

/* BOOT — three emails already in the inbox (HR open), alert pops up shortly after load */
renderInbox();
selectEmail('hr');
setTimeout(openEmailAlert, 800);
</script>

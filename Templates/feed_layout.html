<!DOCTYPE html>
<html lang="en">
<head>
  <title>Chirper</title>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<style>

/* =====================
    COLOUR TOKENS (Twitter/Threads inspired)
===================== */
:root {
    --bg-app:           #ffffff;
    --bg-panel:         #ffffff;
    --bg-hover:         #f7f7f7;
    --bg-input:         #eff3f4;
    --bg-trend-card:    #f7f9f9;
    --accent:           #1d9bf0;
    --accent-hover:     #1a8cd8;
    --accent-tint:      #e8f5fe;
    --like-red:         #f91880;
    --repost-green:     #00ba7c;
    --text-primary:     #0f1419;
    --text-secondary:   #536471;
    --text-muted:       #8b98a5;
    --border-subtle:    #eff3f4;
    --border-medium:    #cfd9de;
    --avatar-blue:      #7ea6d9;
    --avatar-teal:      #6fc2ac;
    --avatar-coral:     #e3987b;
    --avatar-purple:    #a9a4dd;
    --radius-sm:  8px;
    --radius-md:  16px;
    --radius-pill:9999px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "IBM Plex Sans", sans-serif;
    min-height: 100vh;
    background-color: var(--bg-app);
    color: var(--text-primary);
}

a { color: inherit; text-decoration: none; }

/* =====================
    NAVBAR
===================== */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 53px;
    background-color: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    border-bottom: 1px solid var(--border-subtle);
}

.nav-inner {
    width: 100%;
    max-width: 990px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.nav-brand {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
}

.nav-brand .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background-color: var(--accent);
    display: inline-block;
}

/* =====================
    LAYOUT — center feed + right rail
===================== */
.page-shell {
    max-width: 990px;
    margin: 0 auto;
    padding-top: 53px;
    display: flex;
    align-items: flex-start;
    gap: 0;
}

.feed-container {
    width: 600px;
    max-width: 600px;
    min-width: 0;
    border-left: 1px solid var(--border-subtle);
    border-right: 1px solid var(--border-subtle);
    padding-bottom: 60px;
}

.panel-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-primary);
    padding: 14px 16px;
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 53px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    z-index: 5;
}

/* =====================
    COMPOSE CARD
===================== */
.compose-card {
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border-subtle);
    padding: 12px 16px;
}

.compose-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.avatar {
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
}

.avatar.sm { width: 44px; height: 44px; min-width: 44px; font-size: 13px; }
.avatar.xs { width: 32px; height: 32px; min-width: 32px; font-size: 11px; }

.av-blue   { background-color: var(--avatar-blue); }
.av-teal   { background-color: var(--avatar-teal); }
.av-coral  { background-color: var(--avatar-coral); }
.av-purple { background-color: var(--avatar-purple); }

.compose-input-wrap {
    flex: 1;
    padding-top: 8px;
}

.compose-input {
    width: 100%;
    font-family: inherit;
    font-size: 19px;
    color: var(--text-primary);
    background: none;
    border: none;
    resize: none;
    min-height: 44px;
    line-height: 1.4;
}

.compose-input::placeholder { color: var(--text-muted); }
.compose-input:focus { outline: none; }

.compose-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border-subtle);
}

.char-count { font-size: 13px; color: var(--text-muted); }
.char-count.near-limit { color: var(--like-red); font-weight: 600; }

.post-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background-color: var(--accent);
    border: none;
    border-radius: var(--radius-pill);
    padding: 8px 20px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.post-btn:disabled { background-color: var(--accent); opacity: 0.5; cursor: not-allowed; }
.post-btn:not(:disabled):hover { background-color: var(--accent-hover); }

/* =====================
    FEED / POST CARDS
===================== */
.feed-list { display: flex; flex-direction: column; }

.post-card {
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border-subtle);
    padding: 12px 16px;
    transition: background-color 0.1s ease;
}

.post-card:hover { background-color: var(--bg-hover); }

.post-card.new-post { animation: postIn 0.25s ease; }

@keyframes postIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
}

.post-row { display: flex; gap: 12px; }

.post-body { flex: 1; min-width: 0; margin-right: 4px; }

.post-meta { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }

.post-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }

.post-handle, .post-time { font-size: 15px; color: var(--text-muted); }

.post-time::before { content: "·"; margin-right: 5px; color: var(--text-muted); }

.post-text {
    font-size: 15px;
    color: var(--text-primary);
    line-height: 1.4;
    margin-top: 2px;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.post-image {
    margin-top: 10px;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border-subtle);
}

.post-image img { width: 100%; display: block; }

.post-actions {
    display: flex;
    justify-content: space-between;
    max-width: 340px;
    margin-top: 10px;
}

.action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px 8px;
    border-radius: var(--radius-pill);
    transition: background-color 0.15s ease, color 0.15s ease;
}

.action-btn:hover { background-color: var(--accent-tint); color: var(--accent); }
.action-btn.repost:hover { background-color: #e5f9f2; color: var(--repost-green); }
.action-btn.like:hover { background-color: #fde2ec; color: var(--like-red); }

.action-btn .icon { font-size: 15px; line-height: 1; }

.action-btn.like.liked { color: var(--like-red); font-weight: 600; }
.action-btn.repost.reposted { color: var(--repost-green); font-weight: 600; }

.feed-empty { color: var(--text-muted); font-size: 14px; text-align: center; padding: 30px 0; }

/* =====================
    REPLIES THREAD
===================== */
.action-btn.reply .caret {
    font-size: 10px;
    margin-left: 2px;
    transition: transform 0.15s ease;
    display: inline-block;
}

.action-btn.reply.open .caret { transform: rotate(180deg); }

.replies-panel {
    margin-top: 10px;
    padding: 10px 0 0 12px;
    border-left: 2px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.reply-item { display: flex; gap: 8px; align-items: flex-start; }

.reply-bubble {
    background-color: var(--bg-input);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    flex: 1;
    min-width: 0;
}

.reply-meta { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }

.reply-name { font-size: 13px; font-weight: 700; color: var(--text-primary); }

.reply-handle, .reply-time { font-size: 12px; color: var(--text-muted); }

.reply-time::before { content: "·"; margin-right: 5px; color: var(--text-muted); }

.reply-text {
    font-size: 13.5px;
    color: var(--text-primary);
    line-height: 1.4;
    margin-top: 1px;
    word-wrap: break-word;
}

.replies-empty { font-size: 13px; color: var(--text-muted); padding: 2px 0 2px 2px; }

.reply-composer { display: flex; gap: 8px; align-items: center; }

.reply-input {
    flex: 1;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text-primary);
    background-color: var(--bg-input);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    padding: 8px 14px;
}

.reply-input:focus {
    outline: none;
    border-color: var(--accent);
    background-color: #fff;
}

.reply-send-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    background-color: var(--accent);
    border: none;
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
}

.reply-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.reply-send-btn:not(:disabled):hover { background-color: var(--accent-hover); }

/* =====================
    TRENDING SIDEBAR
===================== */
.trend-rail {
    width: 350px;
    max-width: 350px;
    min-width: 0;
    padding: 12px 16px;
    position: sticky;
    top: 53px;
}

.trend-card {
    background-color: var(--bg-trend-card);
    border-radius: var(--radius-md);
    overflow: hidden;
}

.trend-card-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--text-primary);
    padding: 12px 16px 4px;
}

.trend-item {
    display: block;
    padding: 10px 16px;
    cursor: pointer;
    transition: background-color 0.12s ease;
}

.trend-item:hover { background-color: rgba(15,20,25,0.05); }

.trend-item:first-of-type { border-radius: 0; }
.trend-card > .trend-item:last-child { border-radius: 0 0 var(--radius-md) var(--radius-md); }

.trend-meta { font-size: 12.5px; color: var(--text-muted); }

.trend-topic {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 1px;
}

.trend-count { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <div class="nav-brand"><span class="dot"></span>Chirper</div>
    </div>
  </nav>

  <div class="page-shell">

    <div class="feed-container">

      <div class="panel-title">Home</div>

      <!-- COMPOSE -->
      <div class="compose-card">
        <div class="compose-row">
          <div class="avatar sm av-blue">You</div>
          <div class="compose-input-wrap">
            <textarea
              class="compose-input"
              id="composeInput"
              placeholder="What's happening?"
              rows="2"
              maxlength="280"
              oninput="autoGrow(this); updateComposeState();"
            ></textarea>
            <div class="compose-footer">
              <span class="char-count" id="charCount">280</span>
              <button class="post-btn" id="postBtn" onclick="addPost()" disabled>Post</button>
            </div>
          </div>
        </div>
      </div>

      <!-- FEED -->
      <div class="feed-list" id="feedList"></div>

    </div>

    <!-- TRENDING SIDEBAR -->
    <aside class="trend-rail">
      <div class="trend-card" id="trendCard"></div>
    </aside>

  </div>

<script>

  /* =====================
      POST DATA
  ===================== */
  let posts = [
    {
      id: 4,
      name: "Priya D",
      handle: "@priyad",
      avatarInitials: "PD",
      avatarStyle: "av-purple",
      timestamp: new Date(Date.now() - 1000 * 60 * 35),
      text: "Congratulations on joining the team! Excited to see what we build together.",
      image: null,
      reposts: 1,
      likes: 12,
      liked: false,
      reposted: false,
      showReplies: false,
      repliesList: [
        {
          id: 101,
          name: "Mark J",
          handle: "@markj",
          avatarInitials: "MJ",
          avatarStyle: "av-blue",
          timestamp: new Date(Date.now() - 1000 * 60 * 30),
          text: "Same here, been a great first week already."
        },
        {
          id: 102,
          name: "Audrey E",
          handle: "@audreye",
          avatarInitials: "AE",
          avatarStyle: "av-coral",
          timestamp: new Date(Date.now() - 1000 * 60 * 20),
          text: "+1, let's get a sync on the calendar this week."
        },
        {
          id: 103,
          name: "Jordan S",
          handle: "@jordans",
          avatarInitials: "JS",
          avatarStyle: "av-teal",
          timestamp: new Date(Date.now() - 1000 * 60 * 12),
          text: "Welcome aboard!"
        }
      ]
    },
    {
      id: 3,
      name: "Audrey E",
      handle: "@audreye",
      avatarInitials: "AE",
      avatarStyle: "av-coral",
      timestamp: new Date(Date.now() - 1000 * 60 * 60 * 3),
      text: "Come find me whenever you want to grab a coffee and a debrief on everything going on this week ☕",
      image: "https://placebear.com/600/300",
      reposts: 2,
      likes: 28,
      liked: true,
      reposted: false,
      showReplies: false,
      repliesList: [
        {
          id: 104,
          name: "Priya D",
          handle: "@priyad",
          avatarInitials: "PD",
          avatarStyle: "av-purple",
          timestamp: new Date(Date.now() - 1000 * 60 * 60 * 2),
          text: "I'm in, Thursday works for me."
        },
        {
          id: 105,
          name: "Mark J",
          handle: "@markj",
          avatarInitials: "MJ",
          avatarStyle: "av-blue",
          timestamp: new Date(Date.now() - 1000 * 60 * 60),
          text: "Count me in too, been meaning to catch up."
        },
        {
          id: 106,
          name: "You",
          handle: "@you",
          avatarInitials: "You",
          avatarStyle: "av-blue",
          timestamp: new Date(Date.now() - 1000 * 60 * 45),
          text: "Same, coffee on me."
        },
        {
          id: 107,
          name: "Jordan S",
          handle: "@jordans",
          avatarInitials: "JS",
          avatarStyle: "av-teal",
          timestamp: new Date(Date.now() - 1000 * 60 * 30),
          text: "Great, I'll set something up."
        },
        {
          id: 108,
          name: "Priya D",
          handle: "@priyad",
          avatarInitials: "PD",
          avatarStyle: "av-purple",
          timestamp: new Date(Date.now() - 1000 * 60 * 15),
          text: "Perfect, see everyone there!"
        }
      ]
    },
    {
      id: 2,
      name: "Jordan S",
      handle: "@jordans",
      avatarInitials: "JS",
      avatarStyle: "av-teal",
      timestamp: new Date(Date.now() - 1000 * 60 * 60 * 6),
      text: "Looking forward to getting to know everyone better. Let me know if you need a hand with anything this sprint.",
      image: null,
      reposts: 0,
      likes: 9,
      liked: false,
      reposted: false,
      showReplies: false,
      repliesList: [
        {
          id: 109,
          name: "Priya D",
          handle: "@priyad",
          avatarInitials: "PD",
          avatarStyle: "av-purple",
          timestamp: new Date(Date.now() - 1000 * 60 * 60 * 5),
          text: "Appreciate that, might take you up on it."
        }
      ]
    },
    {
      id: 1,
      name: "Mark J",
      handle: "@markj",
      avatarInitials: "MJ",
      avatarStyle: "av-blue",
      timestamp: new Date(Date.now() - 1000 * 60 * 60 * 22),
      text: "A few ideas I'd love to share with the new leaders group once everyone's settled in.",
      image: null,
      reposts: 0,
      likes: 4,
      liked: false,
      reposted: false,
      showReplies: false,
      repliesList: []
    }
  ];

  /* =====================
      TRENDING DATA
      Array-driven, same pattern as posts — mapped to HTML inside
      renderTrends(), never hand-edited in the DOM.
  ===================== */
  let trends = [
    { category: "Business · Trending", topic: "Q3 Roadmap", count: "1,204 posts" },
    { category: "Trending in Team", topic: "#NewHires", count: "312 posts" },
    { category: "Technology · Trending", topic: "Sprint Planning", count: "980 posts" },
    { category: "Trending", topic: "Coffee Debrief", count: "87 posts" },
    { category: "Trending in Team", topic: "Leaders Group", count: "56 posts" }
  ];

  let nextReplyId = 200;

  let nextId = Math.max(...posts.map(p => p.id)) + 1;

  // ── HELPERS ───────────────────────────────────────────────────────────
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTimestamp(date) {
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.round(diffMs / 60000);
    const diffHours = Math.round(diffMs / 3600000);
    const diffDays = Math.round(diffMs / 86400000);

    if (diffMins < 1) return "now";
    if (diffMins < 60) return diffMins + "m";
    if (diffHours < 24) return diffHours + "h";
    if (diffDays < 7) return diffDays + "d";
    return date.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  // ── RENDER: TRENDS ───────────────────────────────────────────────────
  function renderTrends() {
    const card = document.getElementById("trendCard");
    card.innerHTML = `
      <div class="trend-card-title">What's happening</div>
      ${trends.map(t => `
        <div class="trend-item">
          <div class="trend-meta">${escapeHtml(t.category)}</div>
          <div class="trend-topic">${escapeHtml(t.topic)}</div>
          <div class="trend-count">${escapeHtml(t.count)}</div>
        </div>
      `).join("")}
    `;
  }

  // ── RENDER: FEED ─────────────────────────────────────────────────────
  function renderFeed() {
    const list = document.getElementById("feedList");

    if (posts.length === 0) {
      list.innerHTML = '<p class="feed-empty">No posts yet. Be the first to post.</p>';
      return;
    }

    list.innerHTML = posts.map(p => `
      <div class="post-card${p.isNew ? " new-post" : ""}" data-id="${p.id}">
        <div class="post-row">
          <div class="avatar ${p.avatarStyle}">${escapeHtml(p.avatarInitials)}</div>
          <div class="post-body">
            <div class="post-meta">
              <span class="post-name">${escapeHtml(p.name)}</span>
              <span class="post-handle">${escapeHtml(p.handle)}</span>
              <span class="post-time">${formatTimestamp(p.timestamp)}</span>
            </div>
            <div class="post-text">${escapeHtml(p.text)}</div>
            ${p.image ? `
              <div class="post-image">
                <img src="${p.image}" alt="Post image">
              </div>` : ""}
            <div class="post-actions">
              <button class="action-btn reply${p.showReplies ? " open" : ""}" onclick="toggleReplies(${p.id})">
                <span class="icon">💬</span><span>${p.repliesList.length}</span><span class="caret">▾</span>
              </button>
              <button class="action-btn repost${p.reposted ? " reposted" : ""}" onclick="toggleRepost(${p.id})">
                <span class="icon">🔁</span><span>${p.reposts}</span>
              </button>
              <button class="action-btn like${p.liked ? " liked" : ""}" onclick="toggleLike(${p.id})">
                <span class="icon">${p.liked ? "❤️" : "🤍"}</span><span>${p.likes}</span>
              </button>
              <button class="action-btn share" onclick="sharePost(${p.id})">
                <span class="icon">📤</span>
              </button>
            </div>
            ${p.showReplies ? `
              <div class="replies-panel">
                ${p.repliesList.length === 0
                  ? '<div class="replies-empty">No replies yet. Be the first to reply.</div>'
                  : p.repliesList.map(r => `
                    <div class="reply-item">
                      <div class="avatar xs ${r.avatarStyle}">${escapeHtml(r.avatarInitials)}</div>
                      <div class="reply-bubble">
                        <div class="reply-meta">
                          <span class="reply-name">${escapeHtml(r.name)}</span>
                          <span class="reply-handle">${escapeHtml(r.handle)}</span>
                          <span class="reply-time">${formatTimestamp(r.timestamp)}</span>
                        </div>
                        <div class="reply-text">${escapeHtml(r.text)}</div>
                      </div>
                    </div>
                  `).join("")
                }
                <div class="reply-composer">
                  <div class="avatar xs av-blue">You</div>
                  <input
                    type="text"
                    class="reply-input"
                    id="replyInput-${p.id}"
                    placeholder="Post your reply"
                    oninput="updateReplyState(${p.id})"
                    onkeydown="if(event.key==='Enter'){event.preventDefault();addReply(${p.id});}"
                  >
                  <button class="reply-send-btn" id="replySendBtn-${p.id}" onclick="addReply(${p.id})" disabled>Reply</button>
                </div>
              </div>
            ` : ""}
          </div>
        </div>
      </div>
    `).join("");

    posts.forEach(p => p.isNew = false);
  }

  // ── ACTIONS ──────────────────────────────────────────────────────────
  function addPost() {
    const input = document.getElementById("composeInput");
    const text = input.value.trim();
    if (!text) return;

    posts.unshift({
      id: nextId++,
      name: "You",
      handle: "@you",
      avatarInitials: "You",
      avatarStyle: "av-blue",
      timestamp: new Date(),
      text: text,
      image: null,
      reposts: 0,
      likes: 0,
      liked: false,
      reposted: false,
      isNew: true,
      showReplies: false,
      repliesList: []
    });

    input.value = "";
    autoGrow(input);
    updateComposeState();
    renderFeed();
  }

  function toggleLike(id) {
    const post = posts.find(p => p.id === id);
    if (!post) return;
    post.liked = !post.liked;
    post.likes += post.liked ? 1 : -1;
    renderFeed();
  }

  function toggleRepost(id) {
    const post = posts.find(p => p.id === id);
    if (!post) return;
    post.reposted = !post.reposted;
    post.reposts += post.reposted ? 1 : -1;
    renderFeed();
  }

  function toggleReplies(id) {
    const post = posts.find(p => p.id === id);
    if (!post) return;
    post.showReplies = !post.showReplies;
    renderFeed();
  }

  function addReply(postId) {
    const post = posts.find(p => p.id === postId);
    if (!post) return;

    const input = document.getElementById(`replyInput-${postId}`);
    const text = input.value.trim();
    if (!text) return;

    post.repliesList.push({
      id: nextReplyId++,
      name: "You",
      handle: "@you",
      avatarInitials: "You",
      avatarStyle: "av-blue",
      timestamp: new Date(),
      text: text
    });

    post.showReplies = true;
    renderFeed();
  }

  function updateReplyState(postId) {
    const input = document.getElementById(`replyInput-${postId}`);
    const btn = document.getElementById(`replySendBtn-${postId}`);
    btn.disabled = input.value.trim().length === 0;
  }

  function sharePost(id) {
    document.getElementById("composeInput").focus();
  }

  // ── COMPOSER UTILS ───────────────────────────────────────────────────
  function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function updateComposeState() {
    const input = document.getElementById("composeInput");
    const btn = document.getElementById("postBtn");
    const countEl = document.getElementById("charCount");
    const remaining = 280 - input.value.length;

    btn.disabled = input.value.trim().length === 0;
    countEl.textContent = remaining;
    countEl.classList.toggle("near-limit", remaining <= 20);
  }

  // Post on Cmd/Ctrl+Enter
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("composeInput");
    input.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        addPost();
      }
    });
  });

  renderFeed();
  renderTrends();

</script>
</body>
</html>

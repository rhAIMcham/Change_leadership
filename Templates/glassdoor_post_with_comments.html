<!DOCTYPE html>
<html lang="en">
<head>
  <title>Clear view interface</title>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<style>

/* =====================
    COLOUR TOKENS
===================== */
:root {
    --AIMblue: #4353A3;
    --darkBlue: #38416D;
    --teal: #5DC8B9;
    --cream: #F1EEDE;
    --grey: #e7e9ec;
    --rust: #AF4510;
    --navy: #12195C;
    --white: #ffffff;
    --lightBlue: #AEBAE4;
    --bg-app:          #f0ede8;
    --bg-sidebar:      #e8e4de;
    --bg-activity-pane:#454545;
    --bg-panel:        #ffffff;
    --bg-message-head: #f5f3f0;
    --bg-private-tag:  #fff0ee;
    --bg-unread-dot:   #378add;
    --bg-avatar-blue:  #b5d4f4;
    --bg-avatar-teal:  #9fe1cb;
    --bg-selected-row: #e6f1fb;
    --bg-badge:        #d85a30;
    --bg-input:        #f5f3f0;
    --text-primary:    #1a1a1a;
    --text-secondary:  #666660;
    --text-muted:      #999994;
    --text-avatar-blue:#0c447c;
    --text-avatar-teal:#085041;
    --text-private:    #993c1d;
    --text-badge:      #ffffff;
    --text-link:       #185fa5;
    --border-subtle:   #dedad3;
    --border-medium:   #ccc8c0;
    --radius-sm:  6px;
    --radius-md:  8px;
    --radius-lg:  12px;
    --radius-pill:99px;
    --purple-dark: #464775;
    --purple-mid:  #6264A7;
    --purple-light:#9EA2D4;
    --sidebar-bg:  #1b1b2e;
    --channel-bg:  #252538;
    --chat-bg:     #ffffff;
    --text-primary:#1a1a1a;
    --text-secondary:#555;
    --text-muted:  #999;
    --border:      rgba(0,0,0,0.1);
    --bg-secondary:#f5f5f5;
    --bg-primary:  #ffffff;
    --online:      #6EBB8A;
    --away:        #F4A540;
    --busy:        #E04D4D;
    --unread:      #D65B8E;
    --star-empty:  #d8d5cc;
    --star-fill:   #E0A63E;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "IBM-Plex-Sans", sans-serif;
    padding: 20px;
    min-height: 100vh;
    background-color: var(--bg-app);
}


.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background-color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
    border-bottom: 1px solid var(--border-subtle);
}

/* Logo styling */
.nav-brand {
        margin: 0 120px;
    font-size: 1.2rem;
    font-weight: bold;
}

/* Links list */
.nav-links {
        margin: 0 120px;
    list-style: none;
    display: flex;
}

/* Link items */
.nav-links li {
    margin-left: 1.5rem;
}

/* Link anchors */
.nav-links a {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 0.95rem;
    transition: color 0.3s ease;
}

/* Hover effect */
.nav-links a:hover {
    color: var(--bg-unread-dot);
}

/* Push content down so it is not hidden under the fixed navbar */
.content {
    margin-top: 80px;
    padding: 2rem;
}

.container {
    display: flex;
    max-width: 1600px;
    margin: 0 auto;
    transition: margin-right 0.3s ease;
    overflow: hidden;
    margin-top: 85px;
    align-items: flex-start;
}

section {
    min-width: 300px;
}

.left-panel {
    margin: 15px;
}

.middle-panel {
    margin: 15px;
    flex: 1;
}

.right-panel {
    margin: 15px;
}

.panel-heading {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    padding: 0 4px 10px;
}

.panel-subheading {
    font-size: 12px;
    color: var(--text-muted);
    padding: 0 4px 14px;
}

.post-card {
    border: var(--border-subtle) solid 1px;
    background-color: var(--bg-primary);
    border-radius: 4px;
}

.header {
    display: flex;
    border-bottom: var(--border-subtle) solid 1px;
    background: var(--bg-panel);
  margin: 4px;
}

.post-details {
    display: flex;
    justify-content: space-between;
    width: 100%;
}

.header-details {
    display: flex;
     margin-top: 10px;
}

.header-icon {
    margin: 4px;
}

.header-icon > svg {
    width: 200px;
    /* border: solid 8px white; */
}
.header-text {
    margin: 4px;
}

.header-text > h4 {
    padding: 3px;
    color: var(--text-primary);
}

.header-text > p {
    padding: 3px;
    color: var(--text-secondary);
    font-size: 13px;
}

.header-interactive {
    margin-top: 10px;
    padding-right: 5px;
}

.card-content {
    margin: auto;
}

.card-content-text {
    margin: 4px;
    padding: 20px 12px;
    background-color: var(--bg-primary);
    border-bottom: var(--border-subtle) solid 1px;
}

.card-content-text > p {
    color: var(--text-primary);
    line-height: 1.5;
}

.card-content-image_video {
    padding: 15px;
    margin: 6px;
  align-content: center;
  background-color: var(--bg-panel);
  border-bottom: var(--border-subtle) solid 1px;
}

.card-content-image_video img {
    width: 100%;
    border-radius: 4px;
    display: block;
}

.card-reactions {
    margin: 4px;
    background: white;
    border-radius: 4px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 15px;
}

.card-reactions .reactions-label {
    color: var(--text-secondary);
    font-size: 14px;
    margin-right: 4px;
}

.emoji {
    border-radius: var(--radius-pill);
    border: var(--border-subtle) solid 1px;
    background-color: var(--bg-input);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.emoji:active {
    transform: scale(0.95);
}

.emoji:hover {
    border-color: var(--border-medium);
}

.emoji .emoji-char {
    font-size: 16px;
    line-height: 1;
}

.emoji .emoji-count {
    color: var(--text-secondary);
    font-size: 14px;
}

.emoji.reacted {
    background-color: var(--bg-selected-row);
    border-color: var(--AIMblue);
}

.emoji.reacted .emoji-count {
    color: var(--AIMblue);
    font-weight: 600;
}

/* =====================
    COMMENTS
===================== */
.comments-container {
    margin-top: 8px;
    background-color: var(--bg-panel);
    border-radius: 4px;
    border: var(--border-subtle) solid 1px;
    padding: 12px;
}

.comments-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: var(--border-subtle) solid 1px;
}

.comments-toolbar h5 {
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 600;
}

.sort-select {
    font-family: inherit;
    font-size: 13px;
    color: var(--text-secondary);
    background-color: var(--bg-input);
    border: var(--border-subtle) solid 1px;
    border-radius: var(--radius-pill);
    padding: 4px 10px;
    cursor: pointer;
}

/* --- add comment composer --- */
.comment-composer {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: var(--border-subtle) solid 1px;
}

.comment-avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background-color: var(--bg-avatar-teal);
    color: var(--text-avatar-teal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
}

.comment-avatar.blue {
    background-color: var(--bg-avatar-blue);
    color: var(--text-avatar-blue);
}

.composer-input-wrap {
    flex: 1;
}

.comment-input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    background-color: var(--bg-input);
    border: var(--border-subtle) solid 1px;
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    resize: none;
    min-height: 38px;
    line-height: 1.4;
}

.comment-input:focus {
    outline: none;
    border-color: var(--AIMblue);
    background-color: var(--white);
}

.composer-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 6px;
}

.post-comment-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--white);
    background-color: var(--AIMblue);
    border: none;
    border-radius: var(--radius-pill);
    padding: 6px 16px;
    cursor: pointer;
}

.post-comment-btn:disabled {
    background-color: var(--border-medium);
    cursor: not-allowed;
}

.post-comment-btn:not(:disabled):hover {
    background-color: var(--darkBlue);
}

/* --- comment list --- */
.comments-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.comment-box {
    display: flex;
    gap: 8px;
    align-items: flex-start;
}

.comment-body {
    flex: 1;
}

.comment-bubble {
    background-color: var(--bg-input);
    border-radius: var(--radius-lg);
    padding: 8px 14px;
    display: inline-block;
    max-width: 100%;
}

.comment-bubble .comment-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
}

.comment-bubble .comment-text {
    font-size: 14px;
    color: var(--text-primary);
    margin-top: 2px;
    line-height: 1.4;
    word-wrap: break-word;
    max-width: 480px;
}

.comment-meta {
    display: flex;
    gap: 14px;
    margin-top: 4px;
    padding-left: 14px;
}

.comment-meta span {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
}

.comment-meta span:hover {
    color: var(--text-link);
    text-decoration: underline;
}

.comment-meta span.like-btn.liked {
    color: var(--AIMblue);
    font-weight: 600;
}

.comment-meta span.like-btn.liked:hover {
    color: var(--darkBlue);
}

.comments-empty {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 10px 0 4px;
}

/*BUTTONS*/
.pill-btn {
border-radius: var(--radius-pill);
    border: var(--border-subtle) solid 1px;
    background-color: var(--bg-input);
    align-items: center;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}

.comment-btn {
    font-family: inherit;
    font-size: 14px;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
}

.comment-btn:hover {
    color: var(--text-link);
}

/* =====================
    COMPANY HEADER (middle panel)
===================== */
.company-header {
    background-color: var(--bg-primary);
    border: var(--border-subtle) solid 1px;
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.company-logo {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: var(--radius-md);
    background-color: var(--bg-avatar-blue);
    color: var(--text-avatar-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
}

.company-header h2 {
    font-size: 20px;
    color: var(--text-primary);
}

.company-header p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 3px;
}

/* =====================
    PAST REVIEWS (left panel)
===================== */
.review-card {
    background-color: var(--bg-primary);
    border: var(--border-subtle) solid 1px;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-bottom: 10px;
}

.review-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
}

.review-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
}

.review-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
}

.review-stars {
    font-size: 12px;
    letter-spacing: 1px;
    white-space: nowrap;
}

.review-stars .filled { color: var(--star-fill); }
.review-stars .empty { color: var(--star-empty); }

.review-text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.45;
    margin-top: 6px;
}

/* =====================
    RATING METRICS (right panel)
===================== */
.ratings-card {
    background-color: var(--bg-primary);
    border: var(--border-subtle) solid 1px;
    border-radius: var(--radius-md);
    padding: 14px 16px;
}

.metric-row {
    padding: 12px 0;
    border-bottom: var(--border-subtle) solid 1px;
}

.metric-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

.metric-row:first-child {
    padding-top: 0;
}

.metric-label {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 600;
    margin-bottom: 6px;
}

.metric-stars {
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--star-empty);
}

.metric-status {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
}
</style>
</head>

<div class="container">

    <!-- ===================== LEFT PANEL: PAST REVIEWS ===================== -->
    <section class="left-panel">
        <div class="panel-heading">Past reviews</div>
        <div id="pastReviewsList"></div>
    </section>

    <!-- ===================== MIDDLE PANEL: COMPANY + GENERIC COMMENTS ===================== -->
    <section class="middle-panel">

        <div class="company-header">
            <div class="company-logo" id="companyLogo">AC</div>
            <div>
                <h2 id="companyName">Acme Corp</h2>
                <p>Share your experience with this company below</p>
            </div>
        </div>

        <!-- COMMENTS -->
        <div class="comments-container" id="commentsContainer">

            <div class="comments-toolbar">
                <h5 id="commentsCount">0 comments</h5>
                <select class="sort-select" id="sortSelect" onchange="renderComments()">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                </select>
            </div>

            <div class="comment-composer">
                <div class="comment-avatar blue">You</div>
                <div class="composer-input-wrap">
                    <textarea
                        class="comment-input"
                        id="commentInput"
                        placeholder="Leave a comment about this company..."
                        rows="1"
                        oninput="autoGrow(this); toggleButton();"
                        onkeydown="handleComposerKeydown(event)"
                    ></textarea>
                    <div class="composer-actions">
                        <button class="post-comment-btn" id="postBtn" onclick="addComment()" disabled>Post</button>
                    </div>
                </div>
            </div>

            <div class="comments-list" id="commentsList"></div>

        </div>
    </section>

    <!-- ===================== RIGHT PANEL: RATING METRICS (BLANK) ===================== -->
    <section class="right-panel">
        <div class="panel-heading">Company ratings</div>
        <div class="panel-subheading">Not yet rated</div>
        <div class="ratings-card" id="ratingsCard"></div>
    </section>

</div>
<script>

    /* =====================
        PAST REVIEWS DATA (left panel)
        Static, read-only list of prior reviews left about the company.
    ===================== */
    const pastReviews = [
        {
            name: "Jordan Lee",
            rating: 4,
            date: "12 Jul 2026",
            text: "Solid service overall, delivery was a little later than promised."
        },
        {
            name: "Priya Nair",
            rating: 5,
            date: "3 Jun 2026",
            text: "Really happy with how responsive the support team was."
        },
        {
            name: "Sam Okafor",
            rating: 3,
            date: "22 May 2026",
            text: "Good value, but the onboarding process could be clearer."
        },
        {
            name: "Alex Morgan",
            rating: 4,
            date: "9 Apr 2026",
            text: "Reliable so far, would recommend to a small business."
        }
    ];

    function starString(rating) {
        let out = "";
        for (let i = 1; i <= 5; i++) {
            out += `<span class="${i <= rating ? "filled" : "empty"}">★</span>`;
        }
        return out;
    }

    function renderPastReviews() {
        const list = document.getElementById("pastReviewsList");
        list.innerHTML = pastReviews.map(r => `
            <div class="review-card">
                <div class="review-card-head">
                    <div>
                        <div class="review-name">${escapeHtml(r.name)}</div>
                        <div class="review-date">${escapeHtml(r.date)}</div>
                    </div>
                    <div class="review-stars">${starString(r.rating)}</div>
                </div>
                <div class="review-text">${escapeHtml(r.text)}</div>
            </div>
        `).join("");
    }

    /* =====================
        RATING METRICS DATA (right panel)
        Four key metrics the company is rated on. Values are intentionally
        left blank (no score / empty stars) until real rating data exists.
    ===================== */
    const ratingMetrics = [
        { label: "Communication" },
        { label: "Value for money" },
        { label: "Reliability" },
        { label: "Overall satisfaction" }
    ];

    function renderRatingMetrics() {
        const card = document.getElementById("ratingsCard");
        card.innerHTML = ratingMetrics.map(m => `
            <div class="metric-row">
                <div class="metric-label">${escapeHtml(m.label)}</div>
                <div class="metric-stars">★★★★★</div>
                <div class="metric-status">No ratings yet</div>
            </div>
        `).join("");
    }

    /* =====================
        COMMENT DATA
        Reorderable array: change `order` (or just splice/sort this
        array) to control render order. renderComments() always
        rebuilds the DOM from this array, so it's the single
        source of truth.
    ===================== */
    let comments = [
        {
            id: 1,
            name: "Jordan Lee",
            initials: "JL",
            avatarStyle: "teal",
            text: "Great company to deal with, really enjoyed working with them!",
            timestamp: new Date("2026-08-08T09:15:00"),
            liked: false
        },
        {
            id: 2,
            name: "Priya Nair",
            initials: "PN",
            avatarStyle: "blue",
            text: "Thanks for sharing, this is super helpful.",
            timestamp: new Date("2026-08-08T10:42:00"),
            liked: false
        },
        {
            id: 3,
            name: "Sam Okafor",
            initials: "SO",
            avatarStyle: "teal",
            text: "Couldn't agree more with this take.",
            timestamp: new Date("2026-08-09T08:03:00"),
            liked: false
        }
    ];

    let nextId = comments.length + 1;

    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function formatTimestamp(date) {
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.round(diffMs / 60000);
        const diffHours = Math.round(diffMs / 3600000);
        const diffDays = Math.round(diffMs / 86400000);

        if (diffMins < 1) return "Just now";
        if (diffMins < 60) return diffMins + "m";
        if (diffHours < 24) return diffHours + "h";
        if (diffDays < 7) return diffDays + "d";
        return date.toLocaleDateString(undefined, { day: "numeric", month: "short" });
    }

    function renderComments() {
        const list = document.getElementById("commentsList");
        const countEl = document.getElementById("commentsCount");
        const sortOrder = document.getElementById("sortSelect").value;

        // Reorder without mutating the underlying data array's stored order
        const ordered = [...comments].sort((a, b) => {
            return sortOrder === "newest"
                ? b.timestamp - a.timestamp
                : a.timestamp - b.timestamp;
        });

        countEl.textContent = comments.length === 1
            ? "1 comment"
            : comments.length + " comments";

        if (ordered.length === 0) {
            list.innerHTML = '<p class="comments-empty">No comments yet. Be the first to comment.</p>';
            return;
        }

        list.innerHTML = ordered.map(c => `
            <div class="comment-box" data-id="${c.id}">
                <div class="comment-avatar ${c.avatarStyle}">${escapeHtml(c.initials)}</div>
                <div class="comment-body">
                    <div class="comment-bubble">
                        <div class="comment-name">${escapeHtml(c.name)}</div>
                        <div class="comment-text">${escapeHtml(c.text)}</div>
                    </div>
                    <div class="comment-meta">
                        <span>${formatTimestamp(c.timestamp)}</span>
                        <span class="like-btn${c.liked ? " liked" : ""}" onclick="likeComment(${c.id})">${c.liked ? "Liked" : "Like"}</span>
                    </div>
                </div>
            </div>
        `).join("");
    }

    function addComment() {
        const input = document.getElementById("commentInput");
        const text = input.value.trim();
        if (!text) return;

        // New comments are pushed into the data array; renderComments()
        // handles putting them in the right visual position per the
        // current sort order.
        comments.push({
            id: nextId++,
            name: "You",
            initials: "You",
            avatarStyle: "blue",
            text: text,
            timestamp: new Date(),
            liked: false
        });

        input.value = "";
        autoGrow(input);
        toggleButton();

        // Make sure the newly added comment is visible
        document.getElementById("sortSelect").value = "newest";
        renderComments();
    }

    function likeComment(id) {
        const comment = comments.find(c => c.id === id);
        if (!comment) return;
        comment.liked = !comment.liked;
        renderComments();
    }

    function focusComposer() {
        document.getElementById("commentInput").focus();
    }

    function autoGrow(el) {
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
    }

    function toggleButton() {
        const input = document.getElementById("commentInput");
        const btn = document.getElementById("postBtn");
        btn.disabled = input.value.trim().length === 0;
    }

    function handleComposerKeydown(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            addComment();
        }
    }

    renderPastReviews();
    renderRatingMetrics();
    renderComments();

</script>
</body>
</html>

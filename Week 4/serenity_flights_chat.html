<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* =====================
    COLOUR TOKENS
===================== */
:root {
  --AIMblue: #4353A3;
  --darkBlue: #38416D;
  --teal: #5DC8B9;
  --cream: #F1EEDE;
  --grey: #e7e9ec;
  --rust: #AF4510;
  --navy: #12195C;
  --white: #ffffff;
  --lightBlue: #AEBAE4;
  --bg-app:          #f0ede8;
  --bg-sidebar:      #e8e4de;
  --bg-activity-pane:#454545;
  --bg-panel:        #ffffff;
  --bg-message-head: #f5f3f0;
  --bg-unread-dot:   #378add;
  --bg-selected-row: #e6f1fb;
  --bg-input:        #f5f3f0;

  --text-primary:    #1a1a1a;
  --text-secondary:  #555;
  --text-muted:      #999;

  --border-subtle:   #dedad3;
  --border-medium:   #ccc8c0;
  --border:          rgba(0,0,0,0.1);

  --purple-mid:  #6264A7;
  --purple-light:#9EA2D4;
  --channel-bg:  #252538;
  --chat-bg:     #ffffff;
  --bg-secondary:#f5f5f5;
  --bg-primary:  #ffffff;
  --online:      #6EBB8A;
  --away:        #F4A540;
  --busy:        #E04D4D;
  --radius-md:   8px;
  --radius-lg:   12px;
}

body { font-family: 'Inter', sans-serif; }

svg { fill: white; cursor: pointer; transition: 300ms ease; width: 30px; margin: 5px; }
svg:hover { fill: var(--teal); }

.workArea3 {
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ── APP SHELL ── */
.teams-app {
  display: flex;
  width: 960px;
  height: 600px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  background: var(--bg-panel);
}

/* ── ACTIVITY BAR ── */
.activity-bar {
  width: 65px;
  flex-shrink: 0;
  background: var(--bg-activity-pane);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 2px;
}
.activity-bar-top { display: flex; flex-direction: column; align-items: center; gap: 15px; flex: 1; margin-top: 15px; }
.activity-icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px; cursor: pointer;
  color: rgba(255,255,255,0.55); font-size: 18px;
  position: relative; transition: background 0.15s, color 0.15s;
}
.activity-icon:hover, .activity-icon.active { background: rgba(255,255,255,0.13); color: #fff; }

/* ── LEFT SIDEBAR ── */
.left-sidebar {
  color: black;
  width: 210px;
  flex-shrink: 0;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid rgba(255,255,255,0.05);
}
.sidebar-header { padding: 14px 12px 8px; display: flex; align-items: center; gap: 8px; }
.sidebar-header-title { font-size: 1.4rem; font-weight: 600; flex: 1; }

.dm-unread-count {
  background: var(--busy);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 10px;
  margin-left: auto;
}

.dm-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; cursor: pointer;
  border-radius: 5px; margin: 1px 5px;
  transition: background 0.1s;
}
.dm-item:hover { color: var(--AIMblue); }
.dm-item.active { background: white; }

.dm-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; flex-shrink: 0; position: relative;
}
.status-dot {
  position: absolute; bottom: -1px; right: -1px;
  width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px solid var(--channel-bg);
}
.status-online { background: var(--online); }
.status-away   { background: var(--away); }
.status-busy   { background: var(--busy); }

.dm-name { font-size: 12px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-item.active .dm-name { color: var(--navy); }
.dm-item:hover .dm-name { color: var(--AIMblue); }

/* ── CHAT PANE ── */
.chat-pane { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); min-width: 0; }

.chat-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-message-head);
}
.chat-header-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.chat-header-icon { font-size: 17px; color: var(--purple-mid); }
.chat-header-name { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.chat-header-desc { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── MESSAGES ── */
.chat-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }

.date-divider { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 11px; color: var(--text-muted); }
.date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.chat-group { display: flex; gap: 10px; padding: 3px; align-items: flex-start; border-radius: 6px; margin-top: 7px; }
.chat-group:hover { background: var(--bg-secondary); }

.chat-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  margin-top: 2px; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700;
}
.chat-content { flex: 1; min-width: 0; }
.chat-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.chat-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.chat-time { font-size: 11px; color: var(--text-muted); }
.chat-text { font-size: 13px; color: var(--text-primary); line-height: 1.55; }

.learner { border: solid grey 0px; }

.learnerOption {
  border: solid 1px var(--border-medium);
  padding: 10px;
  border-radius: 8px;
  margin: 5px;
  cursor: pointer;
  transition: 300ms ease;
  background-color: var(--bg-selected-row);
  color: var(--text-muted);
}
.learnerOption:hover, .learnerOption:focus-visible {
  background: white;
  margin-left: 7px;
  color: black;
  outline: none;
}

.chat-answers-box { border-radius: 8px; display: flex; }
.explainerP { font-size: 12px; display: flex; justify-content: center; margin: 10px; }

/* ── AVATAR COLOURS ── */
.av-blue   { background: #B5D4F4; color: #0C447C; }
.av-teal   { background: #9FE1CB; color: #085041; }
.av-coral  { background: #F5C4B3; color: #712B13; }
.av-purple { background: #9EA2D4; color: #3C3489; }

/* ── CALLS / CONTACTS ── */
.search-bar { padding: 10px 16px; border-bottom: 1px solid var(--border-subtle); }
.search-input {
  width: 100%; background: #f0ede8; border: 1px solid rgba(0,0,0,0.1);
  border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none;
  font-family: inherit; color: var(--text-primary);
}
.search-input::placeholder { color: var(--text-muted); }
.contact-group-label {
  padding: 8px 16px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  text-transform: uppercase; color: var(--text-muted); background: #faf9f7;
  border-bottom: 1px solid rgba(0,0,0,0.04);
}
.contact-item {
  display: flex; align-items: center; gap: 12px; padding: 9px 16px;
  border-bottom: 1px solid rgba(0,0,0,0.04); cursor: pointer;
}
.contact-item:hover { background: #f5f3f0; }
.contact-avatar {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; position: relative;
}
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }

.pane-header {
  padding: 10px 16px; border-bottom: 1px solid var(--border-subtle);
  display: flex; align-items: center; gap: 10px; background: var(--bg-message-head);
}
.pane-header-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.pane-header-desc { font-size: 12px; color: var(--text-muted); }
.pane-body { flex: 1; overflow-y: auto; }
.no-calls { display: flex; justify-content: space-around; margin: 20px; color: var(--text-muted); font-size: 12px; }

.missed-teams-dot {
  position: absolute;
  width: 15px; height: 15px;
  border-radius: 50%;
  border: 1.5px solid white;
  font-size: 11px; color: white; text-align: center;
}
.messages-waiting { display: flex; }

.dm-avatar > svg { fill: black; }

#chatSection { display: flex; width: 895px; }
#phoneSection { display: none; width: 895px; }

/* Typing delay styling */
.new-message { opacity: 0; transform: translateY(6px); transition: opacity 0.25s ease, transform 0.25s ease; }
.new-message.visible { opacity: 1; transform: translateY(0); }

.typing-dots span {
  display: inline-block; width: 6px; height: 6px; margin-right: 3px;
  border-radius: 50%; background: var(--text-muted);
  animation: typingBounce 1s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typingBounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-3px); opacity: 1; }
}

@media only screen and (max-width: 767px) {
  .chat-header-desc { text-wrap: wrap; }
  .teams-app { flex-direction: column; height: auto; width: 100%; max-width: 100%; }
  .activity-bar { width: auto; flex-direction: row; }
  .activity-bar-top { flex-direction: row; justify-content: space-around; margin: 0; }
  #chatSection, #phoneSection { width: 100%; }
  .left-sidebar { width: 80px; flex-direction: column; }
  .dm-item { flex-direction: column; }
  .chat-pane { width: auto; overflow: auto; }
  .chat-body { flex: 1; overflow-y: scroll; max-height: 300px; overflow-x: hidden; }
  .chat-answers-box { flex-direction: column; }
}
</style>
</head>
<body>

<div class="workArea3" id="work3">
<div class="teams-app">

  <!-- ACTIVITY BAR -->
  <div class="activity-bar">
    <div class="activity-bar-top">
      <div class="messages-waiting">
        <div class="activity-icon active" title="Chat" onclick="setActive(this)" tabindex="0" role="button" aria-label="Chat">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>.fa-secondary{opacity:.4}</style></defs><path d="M256 32C114.6 32 0 125.1 0 240c0 49.6 21.4 95 57 130.7C44.5 421.1 2.7 466 2.2 466.5a8 8 0 0 0-1.5 8.7A7.83 7.83 0 0 0 8 480c66.3 0 116-31.8 140.6-51.4A305 305 0 0 0 256 448c141.4 0 256-93.1 256-208S397.4 32 256 32zM128 272a32 32 0 1 1 32-32 32 32 0 0 1-32 32zm128 0a32 32 0 1 1 32-32 32 32 0 0 1-32 32zm128 0a32 32 0 1 1 32-32 32 32 0 0 1-32 32z" class="fa-secondary"/><path d="M128 208a32 32 0 1 0 32 32 32 32 0 0 0-32-32zm128 0a32 32 0 1 0 32 32 32 32 0 0 0-32-32zm128 0a32 32 0 1 0 32 32 32 32 0 0 0-32-32z" class="fa-primary"/></svg>
        </div>
        <span class="missed-teams-dot status-busy" id="totalUnread">3</span>
      </div>
      <div class="activity-icon" title="Calls" onclick="setActive(this)" tabindex="0" role="button" aria-label="Calls">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>.fa-secondary{opacity:.4}</style></defs><path d="M336.23 167.12L406 4.43 389.41.61a24.16 24.16 0 0 0-27.5 13.9l-48 112a23.9 23.9 0 0 0 6.91 28zM154.6 320.71a24 24 0 0 0-28-6.91l-112 48a24.3 24.3 0 0 0-14 27.61l3.8 16.49 162.81-69.77zm338.81-296.1l-55.75-12.87L362 188.23l19.39 15.87A370.59 370.59 0 0 1 204.2 381.3l-15.88-19.4-176.6 75.69 12.89 55.82A24 24 0 0 0 48 512c256.1 0 464-207.49 464-464a24 24 0 0 0-18.59-23.39z" class="fa-secondary"/><path d="M406 4.43l-69.77 162.69L362 188.23l75.66-176.49zM4.41 405.9l7.31 31.69 176.6-75.69-21.1-25.77z" class="fa-primary"/></svg>
      </div>
    </div>
  </div>

  <!-- CHAT SECTION -->
  <div id="chatSection">
    <div class="left-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-header-title">Chats</span>
      </div>
      <div id="dmList"><!-- built by renderDMs() --></div>
    </div>

    <div class="chat-pane">
      <div class="chat-header">
        <div class="chat-header-left">
          <i class="chat-header-icon" id="header-icon"></i>
          <div>
            <div class="chat-header-name" id="chat-title"></div>
            <div class="chat-header-desc" id="chat-desc"></div>
          </div>
        </div>
      </div>
      <div class="chat-body" id="chat-body"></div>
    </div>
  </div>

  <!-- PHONE SECTION -->
  <div id="phoneSection">
    <div class="left-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-header-title">Calls</span>
      </div>
      <div class="dm-item active" id="tab-calls" onclick="switchPhoneTab('calls', this)" tabindex="0" role="button">
        <div class="dm-avatar av-blue">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>.fa-secondary{opacity:.4}</style></defs><path d="M256 240a72 72 0 1 0 72 72 72 72 0 0 0-72-72zm250.18-117C436.76 65 347.38 32 256 32S75.24 65 5.82 123A16.45 16.45 0 0 0 0 135.64V192a16 16 0 0 0 16 16h70.11a16 16 0 0 0 14.31-8.85L128 128c39.9-17.28 83.2-24 128-24 44.77 0 88.07 6.72 128 24l27.58 71.15a16 16 0 0 0 14.31 8.85H496a16 16 0 0 0 16-16v-56.36a16.45 16.45 0 0 0-5.82-12.64z" class="fa-secondary"/><path d="M475.78 376.62L370.43 192.25A64 64 0 0 0 314.86 160H197.14a64 64 0 0 0-55.57 32.25L36.22 376.62A32 32 0 0 0 32 392.5V448a32 32 0 0 0 32 32h384a32 32 0 0 0 32-32v-55.5a32 32 0 0 0-4.22-15.88zM256 384a72 72 0 1 1 72-72 72 72 0 0 1-72 72z" class="fa-primary"/></svg>
        </div>
        <span class="dm-name">Recent calls</span>
      </div>
      <div class="dm-item" id="tab-contacts" onclick="switchPhoneTab('contacts', this)" tabindex="0" role="button">
        <div class="dm-avatar av-teal">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512"><defs><style>.fa-secondary{opacity:.4}</style></defs><path d="M96 224a64 64 0 1 0-64-64 64.06 64.06 0 0 0 64 64zm480 32h-64a63.81 63.81 0 0 0-45.1 18.6A146.27 146.27 0 0 1 542 384h66a32 32 0 0 0 32-32v-32a64.06 64.06 0 0 0-64-64zm-512 0a64.06 64.06 0 0 0-64 64v32a32 32 0 0 0 32 32h65.9a146.64 146.64 0 0 1 75.2-109.4A63.81 63.81 0 0 0 128 256zm480-32a64 64 0 1 0-64-64 64.06 64.06 0 0 0 64 64z" class="fa-secondary"/><path d="M396.8 288h-8.3a157.53 157.53 0 0 1-68.5 16c-24.6 0-47.6-6-68.5-16h-8.3A115.23 115.23 0 0 0 128 403.2V432a48 48 0 0 0 48 48h288a48 48 0 0 0 48-48v-28.8A115.23 115.23 0 0 0 396.8 288zM320 256a112 112 0 1 0-112-112 111.94 111.94 0 0 0 112 112z" class="fa-primary"/></svg>
        </div>
        <span class="dm-name">Contacts</span>
      </div>
    </div>

    <div class="chat-pane">
      <div id="calls-pane">
        <div class="pane-header">
          <div>
            <div class="pane-header-name">Recent calls</div>
            <div class="pane-header-desc">All calls — today and earlier</div>
          </div>
        </div>
        <div class="pane-body">
          <div class="no-calls"><p>No calls to display</p></div>
        </div>
      </div>

      <div id="contacts-pane" style="display: none; flex-direction: column; height: 100%;">
        <div class="pane-header">
          <div>
            <div class="pane-header-name">Contacts</div>
            <div class="pane-header-desc" id="contactCount"></div>
          </div>
        </div>
        <div class="search-bar">
          <input class="search-input" type="text" placeholder="Search contacts…" aria-label="Search contacts" oninput="filterContacts(this.value)" />
        </div>
        <div class="pane-body" id="contacts-list"></div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
/* =========================================================
   LEARNER (name comes from the LMS, as in the reference file)
   ========================================================= */
function titleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }
let storedName = 'nl test', storedInitial = 'a';
try {
  storedName = localStorage.getItem('riseUserName') || storedName;
  storedInitial = localStorage.getItem('lastInitialToken') || storedInitial;
} catch (e) { /* storage unavailable */ }
const username = titleCase(storedName.trim()) + ' ' + storedInitial.toUpperCase();
const firstName = titleCase(storedName.trim()).split(' ')[0];
const userIcon = storedName.trim().slice(0, 1).toUpperCase() + storedInitial.toUpperCase();

/* =========================================================
   DATA — one entry per chat. Edit text here.
   [NAME] in a message becomes the learner's first name.
   ========================================================= */
const people = {
  antoine: {
    id: 'antoine', name: 'Antoine', initials: 'A', av: 'av-blue', status: 'online',
    desc: 'Online · Pronouns · Join date: placeholder',
    unread: 1,
    messages: [
      { time: '10:58 AM', text: [
        `Hiya [NAME],`,
        `Checking in again. I’m not sure the new target structure is quite hitting the mark. It’s one thing to look at the numbers and decide what customers want, but it’s a little different when you’re actually trying to convince someone to book a holiday. These days, we’re competing with everything from TikTok travel recommendations to influencers showing off a perfect international vacation with miraculously few layovers.`,
        `I’ve picked up a few things over the years about what really gets customers interested, and sometimes I wonder whether that practical side of the business is getting lost in the decisions we’re making. It’s not always as straightforward as it looks on the outside. Let me know if there’s anything I can do to help you and the team.`
      ] }
    ],
    options: [
      { learner: [
          `Hi Antoine,`,
          `I understand that you have concerns, but I’d like you to be more specific about what you think isn’t working. We’re all dealing with the same changes and the same new targets, so it’s important we understand the actual problems rather than just question the decisions being made.`,
          `What exactly do you think we’re getting wrong, and how would you approach things differently? If you have suggestions for improving the way we’re working, I’d expect you to put those forward so we can address them properly.`
        ],
        reply: [
          `I’m not sure what else you want me to say. I’m just pointing out that things aren’t as simple as they might seem and that some people in the team might appreciate the assistance. I’ve been working here long enough to know what customers respond to, and I don’t think I need to justify every decision I make.`,
          `If there’s a particular way you want me to handle things, let me know. Otherwise, I’ll just keep doing my job as best I can.`
        ] },
      { learner: [
          `Hi Antoine,`,
          `There seems to be a gap between what we’re expecting to achieve and what you’re experiencing with customers. I don’t want us to overlook the practical experiences of the team, so it would be useful to understand what differences you’ve identified, and how they might be affecting the team.`,
          `I can schedule a private meeting this week so we can go over this and work out if there are any adjustments we can make. Let me know.`
        ],
        reply: [
          `Yes, I think that would be best.`,
          `Actually, there was a situation last week that probably explains what I mean. I was talking to a customer who wanted to book a holiday in Europe using an influencer’s itinerary, but he was only spending two weeks abroad and wanted to fit a month’s worth of travel into a fortnight. Really impossible to organise, even for us. I tried explaining this, but he wasn’t interested.`,
          `I spent quite a bit of time trying to find something that would give them the same great experience in less time, but they ended up booking something themselves online. Very frustrating, as you can imagine.`,
          `I’ll explain more in the meeting, but looking forward to speaking to you.`
        ] }
    ]
  },

  kelly: {
    id: 'kelly', name: 'Kelly', initials: 'K', av: 'av-coral', status: 'away',
    desc: 'Away · Pronouns · Join date: placeholder',
    unread: 1,
    messages: [
      { time: '10:37 AM', text: [
        `Hi [NAME],`,
        `I’ve been having a few conversations with different people, and I think there are some concerns about the new sales goals that haven’t been properly addressed yet. Everyone is trying to keep up with their bookings, but it’s becoming difficult to manage everything and still give customers the service they deserve. I think the team would appreciate it if these concerns were taken more seriously.`
      ] }
    ],
    options: [
      { learner: [
          `I want to take any genuine concerns seriously, Kelly, but I need to understand exactly what the issues are rather than rely on general feedback. Who has raised these concerns, what are they struggling with specifically, and have they tried discussing it with me directly? Without more detail, it’s difficult to determine what needs to change. Let’s organise a meeting for this week so we can discuss this further.`
        ],
        reply: [
          `I’m not sure I should have brought it up, to be honest. I don’t want to speak for anyone if that’s going to create problems. Everyone has their own way of dealing with things, so perhaps it’s better if people come to you about it themselves.`
        ] },
      { learner: [
          `Thanks for raising this, Kelly. It’s good to talk to each other about how different things are affecting the team, and it’s important that people are comfortable asking for support. At the same time, I need to know what’s causing these concerns before I can act. We can schedule a one-on-one to discuss this further.`
        ],
        reply: [
          `Thanks, I appreciate that. I think it would be useful to check my tasks and make sure I’m approaching things the right way. I don’t want to cause any delays for the customers, even by accident.`,
          `I’m sure we’ll all find our feet as we get used to the new arrangements. I suppose it’s just a matter of working out how to best manage the different demands. I’ll keep an eye on things and let you know if anything changes.`
        ] }
    ]
  },

  robert: {
    id: 'robert', name: 'Robert', initials: 'R', av: 'av-purple', status: 'busy',
    desc: 'Busy · Pronouns · Join date: placeholder',
    unread: 1,
    messages: [
      { time: '9:29 AM', text: [
        `Hey [NAME],`,
        `Thanks for sending through the updated process. I’ve had a look, but I’m going to keep using my usual spreadsheet for now because I know it works and I can keep track of everything this way. I don’t think there’s a difference for the customer, as long as the bookings still get finalised. I’ll let you know if anything comes up.`
      ] }
    ],
    options: [
      { learner: [
          `Hi Robert,`,
          `I understand – everyone has their preferred way of organising their work, so you can take some time to get comfortable with the new process. Let me know if you decide you need a hand with it at all.`
        ],
        reply: [ `Thanks, will do.` ] },
      { learner: [
          `Hi Robert,`,
          `I understand that you’re comfortable with your current workflow, but the updated process is a requirement for the team and is not optional. We need to ensure that bookings and records are managed consistently for the whole team. Can you tell me what’s making the transition difficult? If there are parts you’re unsure about, we can arrange some time to work through them together.`
        ],
        reply: [
          `I know what the instructions say. I just don’t understand why I need to change something that already works to a process that isn’t properly integrated yet. My bookings are still completed, I’m meeting my goals, and I haven’t had any problems with my spreadsheet. It feels like we’re just changing things for the sake of it. I have enough to do without learning another system that might not even make a difference.`

// Time stamps shown on the learner's reply and the response
const REPLY_TIME = '11:15 AM';

// Per-chat progress: which option was picked, and whether the reply has arrived
const state = {};
Object.keys(people).forEach(id => { state[id] = { chosen: null, replied: false }; });
let currentId = 'antoine';

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function para(arr) {
  return '<p>' + arr.map(t => esc(t.replace(/\[NAME\]/g, firstName))).join('<br><br>') + '</p>';
}
function plain(arr) { return arr.map(t => t.replace(/\[NAME\]/g, firstName)).join(' '); }

function group(avClass, initials, name, time, bodyHtml, extra) {
  return `
    <div class="chat-group${extra ? ' ' + extra : ''}">
      <div class="chat-avatar ${avClass}">${esc(initials)}</div>
      <div class="chat-content">
        <div class="chat-meta"><span class="chat-name">${esc(name)}</span><span class="chat-time">${esc(time)}</span></div>
        <div class="chat-text">${bodyHtml}</div>
      </div>
    </div>`;
}

/* =========================================================
   CHAT RENDERING
   ========================================================= */
function threadHtml(id) {
  const p = people[id], s = state[id];
  let html = '<div class="date-divider">Today</div>';
  html += p.messages.map(m => group(p.av, p.initials, p.name, m.time, para(m.text))).join('');

  if (s.chosen === null) {
    html += `
      <div>
        <div class="explainerP"><p>Select the option you would send in this scenario.</p></div>
        <div class="chat-answers-box">
          ${p.options.map((o, i) => `
            <div class="chat-options learnerOption" data-choice="${i}" tabindex="0" role="button">${para(o.learner)}</div>`).join('')}
        </div>
      </div>`;
  } else {
    const o = p.options[s.chosen];
    html += group('av-teal', userIcon, username, REPLY_TIME, para(o.learner), 'learner');
    if (s.replied) html += group(p.av, p.initials, p.name, REPLY_TIME, para(o.reply));
  }
  return html;
}

function setChat(id) {
  currentId = id;
  const p = people[id];
  document.getElementById('chat-title').textContent = p.name;
  document.getElementById('chat-desc').textContent = p.desc;
  const icon = document.getElementById('header-icon');
  icon.innerHTML = `<div class="chat-avatar ${p.av}">${esc(p.initials)}</div>`;
  const body = document.getElementById('chat-body');
  body.innerHTML = threadHtml(id);
  body.scrollTop = body.scrollHeight;
}

function renderDMs() {
  document.getElementById('dmList').innerHTML = Object.values(people).map(p => `
    <div class="dm-item${p.id === currentId ? ' active' : ''}" data-dm="${p.id}" tabindex="0" role="button">
      <div class="dm-avatar ${p.av}">${esc(p.initials)}<span class="status-dot status-${p.status}"></span></div>
      <span class="dm-name">${esc(p.name)}</span>
      ${p.unread ? `<span class="dm-unread-count">${p.unread}</span>` : ''}
    </div>`).join('');
  const total = Object.values(people).reduce((n, p) => n + p.unread, 0);
  const dot = document.getElementById('totalUnread');
  dot.textContent = total;
  dot.style.display = total ? 'block' : 'none';
}

function loadDM(id) {
  people[id].unread = 0;
  renderDMs();
  setChat(id);
}

/* =========================================================
   CHOOSING A REPLY
   ========================================================= */
function chooseOption(index) {
  const id = currentId, p = people[id], s = state[id];
  if (s.chosen !== null) return;
  s.chosen = index;

  const body = document.getElementById('chat-body');
  body.innerHTML = threadHtml(id) + `
    <div class="chat-group typing-indicator" id="typing-${id}">
      <div class="chat-avatar ${p.av}">${esc(p.initials)}</div>
      <div class="chat-content">
        <div class="chat-text typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>`;
  body.scrollTop = body.scrollHeight;

  const o = p.options[index];
  try {   // saved for use elsewhere in the course, as in the reference file
    const key = p.name;
    localStorage.setItem(key + 'Choice', plain(o.learner));
    localStorage.setItem(key + 'Response', plain(o.reply));
  } catch (e) { /* storage unavailable */ }

  setTimeout(() => {
    s.replied = true;
    if (currentId !== id) return;                      // learner moved to another chat; it will render when they return
    const indicator = document.getElementById('typing-' + id);
    if (indicator) indicator.remove();
    const el = document.createElement('div');
    el.innerHTML = group(p.av, p.initials, p.name, REPLY_TIME, para(o.reply), 'new-message');
    const node = el.firstElementChild;
    body.appendChild(node);
    requestAnimationFrame(() => node.classList.add('visible'));
    body.scrollTop = body.scrollHeight;
  }, 1400);
}

document.getElementById('chat-body').addEventListener('click', e => {
  const opt = e.target.closest('[data-choice]');
  if (opt) chooseOption(Number(opt.dataset.choice));
});
document.getElementById('chat-body').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const opt = e.target.closest('[data-choice]');
  if (opt) { e.preventDefault(); chooseOption(Number(opt.dataset.choice)); }
});

document.getElementById('dmList').addEventListener('click', e => {
  const item = e.target.closest('[data-dm]');
  if (item) loadDM(item.dataset.dm);
});
document.getElementById('dmList').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const item = e.target.closest('[data-dm]');
  if (item) { e.preventDefault(); loadDM(item.dataset.dm); }
});

/* =========================================================
   CALLS + CONTACTS + ACTIVITY BAR
   ========================================================= */
function renderContacts() {
  const sorted = Object.values(people).sort((a, b) => a.name.localeCompare(b.name));
  let last = '';
  document.getElementById('contactCount').textContent = sorted.length + ' contacts';
  document.getElementById('contacts-list').innerHTML = sorted.map(p => {
    const letter = p.name.charAt(0).toUpperCase();
    const label = letter !== last ? `<div class="contact-group-label">${letter}</div>` : '';
    last = letter;
    return label + `
      <div class="contact-item" data-name="${esc(p.name.toLowerCase())}">
        <div class="contact-avatar ${p.av}">${esc(p.initials)}<span class="status-dot status-${p.status}"></span></div>
        <div class="contact-info"><div class="contact-name">${esc(p.name)}</div></div>
      </div>`;
  }).join('');
}

function switchPhoneTab(tab, el) {
  document.querySelectorAll('#phoneSection .dm-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('calls-pane').style.display    = tab === 'calls'    ? 'block' : 'none';
  document.getElementById('contacts-pane').style.display = tab === 'contacts' ? 'flex'  : 'none';
}

function filterContacts(val) {
  const query = val.toLowerCase();
  document.querySelectorAll('#contacts-list .contact-item').forEach(item => {
    item.style.display = item.dataset.name.includes(query) ? 'flex' : 'none';
  });
  document.querySelectorAll('#contacts-list .contact-group-label').forEach(label => {
    const next = label.nextElementSibling;
    label.style.display = (next && next.style.display !== 'none') ? 'block' : 'none';
  });
}

function setActive(el) {
  document.querySelectorAll('.activity-icon').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  const icons = Array.from(document.querySelectorAll('.activity-icon'));
  const isChat = icons.indexOf(el) === 0;
  document.getElementById('chatSection').style.display  = isChat ? 'flex' : 'none';
  document.getElementById('phoneSection').style.display = isChat ? 'none' : 'flex';
}
document.querySelectorAll('.activity-icon, #phoneSection .dm-item').forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
  });
});

/* =========================================================
   BOOT
   ========================================================= */
renderContacts();
people.antoine.unread = 0;      // the first chat opens automatically
renderDMs();
setChat('antoine');
</script>
</body>
